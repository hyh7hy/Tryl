<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HAWME Admin — Platform Control & Moderation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        hawme: {
                            cyan: '#25F4EE',
                            coral: '#FE2C55',
                            sage: '#588B6C',
                            sageDeep: '#315C42',
                            darkBg: '#080808',
                            darkSec: '#101113',
                            darkCard: '#151619',
                            darkElev: '#1C1E22',
                            darkBorder: '#26272B',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #080808;
            --bg-sec: #101113;
            --bg-card: #151619;
            --bg-elev: #1C1E22;
            --text-primary: #F4F4F5;
            --text-secondary: #A1A1AA;
            --text-muted: #71717A;
            --accent-primary: #25F4EE;
            --accent-secondary: #FE2C55;
            --border-normal: #26272B;
            --border-focus: #25F4EE;
            --btn-cta-bg: linear-gradient(90deg, #FE2C55 0%, #25F4EE 100%);
            --btn-cta-text: #080808;
            --nav-backdrop: rgba(8, 8, 8, 0.92);
            --atmosphere:
                radial-gradient(ellipse 85% 420px at 50% -40px, rgba(37, 244, 238, 0.11), rgba(254, 44, 85, 0.06) 45%, transparent 78%),
                radial-gradient(circle at 12% 38%, rgba(254, 44, 85, 0.05), transparent 42%),
                linear-gradient(180deg, #080808 0%, #0D0E10 52%, #111215 100%);
        }

        html:not(.dark) {
            --bg-main: #F4F8F3;
            --bg-sec: #ECF3EB;
            --bg-card: #FFFFFF;
            --bg-elev: #F1F6F0;
            --text-primary: #17221B;
            --text-secondary: #4B5B51;
            --text-muted: #738278;
            --accent-primary: #588B6C;
            --accent-secondary: #315C42;
            --border-normal: #DCE6DC;
            --border-focus: #588B6C;
            --btn-cta-bg: linear-gradient(90deg, #315C42 0%, #588B6C 100%);
            --btn-cta-text: #FFFFFF;
            --nav-backdrop: rgba(244, 248, 243, 0.92);
            --atmosphere:
                radial-gradient(ellipse 90% 420px at 50% -50px, rgba(118, 168, 137, 0.24), rgba(220, 237, 224, 0.14) 55%, transparent 80%),
                linear-gradient(180deg, #F7FAF6 0%, #EFF5EE 55%, #E8F1E7 100%);
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            transition: background-color 200ms ease, color 200ms ease;
        }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .atmosphere-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image: var(--atmosphere);
        }
        .card-outer {
            background-color: var(--bg-card);
            border: 1px solid var(--border-normal);
            border-radius: 24px;
        }
        .card-inner {
            background-color: var(--bg-elev);
            border: 1px solid var(--border-normal);
            border-radius: 12px;
        }
        .input-field {
            width: 100%;
            background-color: var(--bg-elev);
            border: 1px solid var(--border-normal);
            border-radius: 12px;
            color: var(--text-primary);
        }
        .input-field:focus {
            outline: none;
            border-color: var(--border-focus);
        }
        .btn-cta {
            background: var(--btn-cta-bg);
            color: var(--btn-cta-text);
            border-radius: 12px;
            font-weight: 800;
            transition: opacity 150ms ease;
        }
        .btn-cta:hover:not(:disabled) { opacity: 0.93; }
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border-normal);
            color: var(--text-primary);
            border-radius: 12px;
            font-weight: 700;
        }
        .btn-ghost:hover { border-color: var(--accent-primary); }
        .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #F87171;
            border-radius: 12px;
            font-weight: 700;
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.22); }
        .text-accent { color: var(--accent-primary); }
        .text-sec { color: var(--text-secondary); }
        .text-mut { color: var(--text-muted); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(130, 130, 130, 0.25); border-radius: 99px; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <div class="atmosphere-glow"></div>
    <div id="toast-container" class="fixed top-4 right-4 left-4 sm:left-auto z-[70] flex flex-col space-y-2.5 pointer-events-none"></div>

    <!-- Confirmation Modal for Destructive Actions -->
    <div id="confirm-modal" onclick="if(event.target===this) closeConfirmModal()" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="card-outer p-6 max-w-sm w-full shadow-2xl space-y-4">
            <h3 id="confirm-title" class="font-black text-lg">Confirm Action</h3>
            <p id="confirm-desc" class="text-xs text-sec leading-relaxed"></p>
            <div class="flex gap-3 pt-1">
                <button id="confirm-exec-btn" class="flex-1 py-3 btn-danger text-xs font-extrabold">Delete Permanently</button>
                <button onclick="closeConfirmModal()" class="flex-1 py-3 btn-ghost text-xs">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Top Admin Bar -->
    <header class="sticky top-0 z-40 backdrop-blur-md border-b" style="background: var(--nav-backdrop); border-color: var(--border-normal);">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[#FE2C55] to-[#25F4EE] flex items-center justify-center p-[2px]">
                    <div class="w-full h-full rounded-[10px] flex items-center justify-center" style="background: var(--bg-main);">
                        <span class="font-black text-accent text-lg">H</span>
                    </div>
                </div>
                <div>
                    <span class="font-extrabold text-base tracking-tight">HAWME Admin</span>
                    <span id="admin-email-badge" class="hidden sm:inline-block ml-2 text-xs text-sec"></span>
                </div>
            </div>

            <div class="flex items-center space-x-2.5">
                <button onclick="refreshAllAdminData()" id="refresh-btn" class="hidden p-2 rounded-xl btn-ghost" title="Refresh Data">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
                <button onclick="toggleThemeMode()" class="p-2 rounded-xl btn-ghost" title="Switch Theme">
                    <i id="theme-toggle-icon" data-lucide="sun" class="w-4 h-4 text-accent"></i>
                </button>
                <button id="admin-logout-btn" onclick="adminLogout()" class="hidden px-3.5 py-2 btn-danger text-xs">
                    Log Out
                </button>
            </div>
        </div>
    </header>

    <main id="admin-app" class="flex-grow relative z-10"></main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
        getAuth,
        signInWithEmailAndPassword,
        signInWithPopup,
        GoogleAuthProvider,
        signOut,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        collection,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        query,
        where
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCayGcfnpCAGNDph3YTyEA9_KDdD2C5Fg0",
        authDomain: "my-tiktok-cbd6f.firebaseapp.com",
        databaseURL: "https://my-tiktok-cbd6f-default-rtdb.firebaseio.com",
        projectId: "my-tiktok-cbd6f",
        storageBucket: "my-tiktok-cbd6f.firebasestorage.app",
        messagingSenderId: "964441294320",
        appId: "1:964441294320:web:4c8da74a0cee8ed2644935",
        measurementId: "G-RYBWW6XB10"
    };

    const SUPABASE_CONFIG = {
        storageUrl: "https://akoddbuemubeorwfwonv.supabase.co/storage/v1",
        publishableKey: "sb_publishable_e433Ao5lccy9spSTVpMqOw_hw25ae_f",
        bucket: "campaign-images"
    };

    // Authorized Admin Emails (can also be granted via users/{uid}.role === 'admin' in Firestore)
    const AUTHORIZED_ADMIN_EMAILS = [
        "hanif@hawme.shop",
        "admin@hawme.shop"
    ];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: 'select_account' });

    window.adminState = {
        user: null,
        isAuthorized: false,
        tab: 'overview',
        search: '',
        roleFilter: 'all',
        users: [],
        campaigns: [],
        verifications: [],
        withdrawals: [],
        transactions: [],
        deals: [],
        applications: [],
        posts: []
    };

    window.escapeHTML = function(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    };

    window.showToast = function(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const borderCol = type === 'error' ? 'border-red-500/60 text-red-400' : (type === 'success' ? 'border-accent text-accent' : '');
        toast.className = `card-outer ${borderCol} px-4 py-3 shadow-xl text-xs font-bold flex items-center space-x-2.5 transition-all duration-200 pointer-events-auto`;
        toast.innerHTML = `
            <i data-lucide="${type === 'success' ? 'check-circle' : (type === 'error' ? 'alert-circle' : 'info')}" class="w-4 h-4 shrink-0"></i>
            <span>${window.escapeHTML(message)}</span>
        `;
        container.appendChild(toast);
        lucide.createIcons();
        setTimeout(() => toast.remove(), 3500);
    };

    window.toggleThemeMode = function() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('hawme_theme_mode', isDark ? 'dark' : 'light');
        const icon = document.getElementById('theme-toggle-icon');
        if (icon) icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
        lucide.createIcons();
    };

    window.uploadImageToSupabase = async function(file) {
        const fileExt = file.name.split('.').pop().toLowerCase();
        const cleanFileName = `admin_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
        const uploadPath = `community/${cleanFileName}`;
        const uploadUrl = `${SUPABASE_CONFIG.storageUrl}/object/${SUPABASE_CONFIG.bucket}/${uploadPath}`;

        const response = await fetch(uploadUrl, {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_CONFIG.publishableKey,
                'Authorization': `Bearer ${SUPABASE_CONFIG.publishableKey}`,
                'Content-Type': file.type || 'image/jpeg',
                'x-upsert': 'true'
            },
            body: file
        });
        if (!response.ok) throw new Error(await response.text());
        return `${SUPABASE_CONFIG.storageUrl}/object/public/${SUPABASE_CONFIG.bucket}/${uploadPath}`;
    };

    // Confirmation Dialog Helper
    window.openConfirmModal = function(title, description, onConfirm) {
        document.getElementById('confirm-title').innerText = title;
        document.getElementById('confirm-desc').innerText = description;
        const btn = document.getElementById('confirm-exec-btn');
        btn.onclick = async () => {
            btn.disabled = true;
            btn.innerText = 'Deleting...';
            try {
                await onConfirm();
                closeConfirmModal();
            } finally {
                btn.disabled = false;
                btn.innerText = 'Delete Permanently';
            }
        };
        document.getElementById('confirm-modal').classList.remove('hidden');
    };

    window.closeConfirmModal = function() {
        document.getElementById('confirm-modal').classList.add('hidden');
    };

    // Auth & Admin Role Check
    async function verifyAdminAccess(fbUser) {
        if (!fbUser) return false;
        const emailLower = (fbUser.email || '').toLowerCase();
        if (AUTHORIZED_ADMIN_EMAILS.includes(emailLower)) return true;
        try {
            const snap = await getDoc(doc(db, "users", fbUser.uid));
            if (snap.exists() && snap.data().role === 'admin') return true;
        } catch (e) {}
        return false;
    }

    onAuthStateChanged(auth, async (fbUser) => {
        window.adminState.user = fbUser;
        if (fbUser) {
            const allowed = await verifyAdminAccess(fbUser);
            window.adminState.isAuthorized = allowed;
            document.getElementById('admin-logout-btn').classList.remove('hidden');
            document.getElementById('refresh-btn').classList.remove('hidden');
            const emailBadge = document.getElementById('admin-email-badge');
            if (emailBadge) {
                emailBadge.innerText = fbUser.email;
                emailBadge.classList.remove('hidden');
            }
            if (allowed) {
                await refreshAllAdminData();
            } else {
                renderAdminApp();
            }
        } else {
            window.adminState.isAuthorized = false;
            document.getElementById('admin-logout-btn').classList.add('hidden');
            document.getElementById('refresh-btn').classList.add('hidden');
            document.getElementById('admin-email-badge')?.classList.add('hidden');
            renderAdminApp();
        }
    });

    window.adminEmailLogin = async function(e) {
        e.preventDefault();
        const email = document.getElementById('admin-email').value.trim();
        const pass = document.getElementById('admin-pass').value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (err) {
            window.showToast('Login failed: ' + err.message, 'error');
        }
    };

    window.adminGoogleLogin = async function() {
        try {
            await signInWithPopup(auth, googleProvider);
        } catch (err) {
            window.showToast('Google sign-in failed: ' + err.message, 'error');
        }
    };

    window.adminLogout = async function() {
        await signOut(auth);
        window.showToast('Signed out of Admin Console', 'info');
    };

    // Load All Firestore Collections for Admin Management
    window.refreshAllAdminData = async function() {
        const s = window.adminState;
        try {
            const [uSnap, cSnap, vSnap, wSnap, tSnap, dSnap, aSnap, pSnap] = await Promise.all([
                getDocs(collection(db, "users")),
                getDocs(collection(db, "campaigns")),
                getDocs(collection(db, "verification_requests")),
                getDocs(collection(db, "withdrawals")),
                getDocs(collection(db, "transactions")),
                getDocs(collection(db, "direct_deals")),
                getDocs(collection(db, "applications")),
                getDocs(collection(db, "community_posts"))
            ]);

            s.users = uSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            s.campaigns = cSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            s.verifications = vSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            s.withdrawals = wSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            s.transactions = tSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            s.deals = dSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            s.applications = aSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            s.posts = pSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

            renderAdminApp();
        } catch (err) {
            window.showToast('Failed to load Firestore data: ' + err.message, 'error');
        }
    };

    window.setAdminTab = function(tab) {
        window.adminState.tab = tab;
        renderAdminApp();
    };

    // ==========================================================================
    // ADMIN ACTIONS: DELETE USERS, DELETE OFFERS, VERIFICATIONS, PAYOUTS, POSTS
    // ==========================================================================

    // 1. Delete User Account & Related Records
    window.promptDeleteUser = function(userId, displayName, role) {
        openConfirmModal(
            `Delete ${displayName}?`,
            `This will permanently delete this ${role} profile from HAWME and remove their associated offers/applications. This cannot be undone.`,
            async () => {
                await deleteDoc(doc(db, "users", userId));

                // Clean up user's campaigns if company
                const userCampaigns = window.adminState.campaigns.filter(c => c.user_id === userId);
                for (const c of userCampaigns) {
                    await deleteDoc(doc(db, "campaigns", c.id));
                }

                // Clean up user's applications if creator
                const userApps = window.adminState.applications.filter(a => a.creator_id === userId);
                for (const a of userApps) {
                    await deleteDoc(doc(db, "applications", a.id));
                }

                window.showToast(`Account "${displayName}" deleted.`, 'success');
                await refreshAllAdminData();
            }
        );
    };

    // Toggle user verification directly from Users table
    window.toggleUserVerified = async function(userId, currentState) {
        const nextState = !currentState;
        try {
            await updateDoc(doc(db, "users", userId), { is_verified: nextState });
            await addDoc(collection(db, "notifications"), {
                user_id: userId,
                title: nextState ? 'Account Verified' : 'Verification Updated',
                message: nextState
                    ? 'Congratulations! Your HAWME verification badge is now active.'
                    : 'Your account verification badge was removed by an administrator.',
                read: false,
                created_at: new Date().toISOString()
            });
            window.showToast(nextState ? 'Verified badge granted!' : 'Verified badge removed.', 'success');
            await refreshAllAdminData();
        } catch (err) { window.showToast(err.message, 'error'); }
    };

    // 2. Delete Offer / Campaign
    window.promptDeleteOffer = function(campaignId, title) {
        openConfirmModal(
            `Delete Offer "${title}"?`,
            `This offer will be permanently deleted from the marketplace along with its pending applications.`,
            async () => {
                await deleteDoc(doc(db, "campaigns", campaignId));
                const relatedApps = window.adminState.applications.filter(a => a.campaign_id === campaignId);
                for (const a of relatedApps) {
                    await deleteDoc(doc(db, "applications", a.id));
                }
                window.showToast(`Offer "${title}" deleted.`, 'success');
                await refreshAllAdminData();
            }
        );
    };

    // Toggle Offer Status (Active <-> Completed)
    window.toggleOfferStatus = async function(campaignId, currentStatus) {
        const next = currentStatus === 'Completed' ? 'Active' : 'Completed';
        try {
            await updateDoc(doc(db, "campaigns", campaignId), { status: next });
            window.showToast(`Offer marked as ${next}.`, 'success');
            await refreshAllAdminData();
        } catch (err) { window.showToast(err.message, 'error'); }
    };

    // 3. Approve or Reject Verification Request
    window.handleVerificationDecision = async function(reqId, userId, approve) {
        try {
            await updateDoc(doc(db, "verification_requests", reqId), {
                status: approve ? 'Approved' : 'Rejected',
                reviewed_at: new Date().toISOString()
            });
            if (approve && userId) {
                await updateDoc(doc(db, "users", userId), { is_verified: true });
            }
            if (userId) {
                await addDoc(collection(db, "notifications"), {
                    user_id: userId,
                    title: approve ? 'Verification Approved' : 'Verification Rejected',
                    message: approve
                        ? 'Your HAWME verification was approved! Your blue badge is now live on your profile.'
                        : 'Your verification request was rejected. Ensure your TikTok bio displays the code and try again.',
                    read: false,
                    created_at: new Date().toISOString()
                });
            }
            window.showToast(approve ? 'Verification approved & badge activated!' : 'Verification request rejected.', 'success');
            await refreshAllAdminData();
        } catch (err) { window.showToast(err.message, 'error'); }
    };

    // 4. Mark Withdrawal / Escrow Payout Completed
    window.completeCreatorWithdrawal = async function(withdrawalId, creatorId, amountEtb, bankName) {
        const refInput = document.getElementById(`tx-ref-${withdrawalId}`);
        const txRef = refInput?.value.trim() || `TX-${Date.now()}`;
        try {
            await updateDoc(doc(db, "withdrawals", withdrawalId), {
                status: 'Completed',
                transaction_reference: txRef,
                paid_at: new Date().toISOString()
            });

            if (creatorId) {
                await addDoc(collection(db, "notifications"), {
                    user_id: creatorId,
                    title: 'Payout Completed',
                    message: `ETB ${Number(amountEtb).toLocaleString()} has been sent to your ${bankName}.`,
                    detail: `Amount Sent: ETB ${Number(amountEtb).toLocaleString()}\nDestination: ${bankName}\nTransaction Reference: ${txRef}`,
                    read: false,
                    created_at: new Date().toISOString()
                });
            }

            window.showToast('Withdrawal marked as Sent & creator notified!', 'success');
            await refreshAllAdminData();
        } catch (err) { window.showToast(err.message, 'error'); }
    };

    // 5. Publish & Delete HAWME Community Announcements
    window.handlePublishCommunityPost = async function(e) {
        e.preventDefault();
        const caption = document.getElementById('admin-post-caption').value.trim();
        const fileInput = document.getElementById('admin-post-image');
        const btn = document.getElementById('publish-post-btn');
        if (!caption) return;

        btn.disabled = true;
        btn.innerText = 'Publishing...';
        try {
            let imageUrl = '';
            if (fileInput?.files?.[0]) {
                imageUrl = await window.uploadImageToSupabase(fileInput.files[0]);
            }
            await addDoc(collection(db, "community_posts"), {
                caption,
                image_url: imageUrl,
                likes_count: 0,
                created_at: new Date().toISOString()
            });
            window.showToast('Official HAWME post published!', 'success');
            await refreshAllAdminData();
        } catch (err) {
            window.showToast('Failed to publish post: ' + err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerText = 'Publish Announcement';
        }
    };

    window.promptDeletePost = function(postId) {
        openConfirmModal(
            'Delete Community Post?',
            'This announcement will be removed from the Explore feed.',
            async () => {
                await deleteDoc(doc(db, "community_posts", postId));
                window.showToast('Post deleted.', 'success');
                await refreshAllAdminData();
            }
        );
    };

    // 6. Delete Direct Deal
    window.promptDeleteDeal = function(dealId) {
        openConfirmModal(
            'Delete Direct Deal?',
            'Remove this direct collaboration record permanently?',

                    ${s.posts.map(p => `
                        <div class="card-outer p-5 flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                            <div class="space-y-2 min-w-0">
                                <p class="text-xs text-mut tabular-nums">${p.created_at ? new Date(p.created_at).toLocaleString() : ''} · ${Number(p.likes_count || 0)} Likes</p>
                                <p class="text-xs leading-relaxed whitespace-pre-line">${window.escapeHTML(p.caption || '')}</p>
                                ${p.image_url ? `<img src="${window.escapeHTML(p.image_url)}" class="max-h-48 rounded-xl object-cover">` : ''}
                            </div>
                            <button onclick="promptDeletePost('${p.id}')" class="px-3.5 py-2 btn-danger text-xs shrink-0">Delete</button>
                        </div>
                    `).join('') || `<div class="card-outer p-8 text-center text-xs text-sec">No community posts published yet.</div>`}
                </div>
            </div>
        `;
    }

    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('hawme_theme_mode') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            const icon = document.getElementById('theme-toggle-icon');
            if (icon) icon.setAttribute('data-lucide', 'moon');
        }
        renderAdminApp();
    });
</script>
</body>
</html>
