            height: 100vh;

            z-index: -1;
            overflow: hidden;

            position: absolute;
            top: -10vh;
            right: -10vw;

            left: -10vw;

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-main);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-elevated);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Glassmorphism elements */
        .glass-nav {
            background: rgba(16, 18, 22, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
        }
        html.light .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            border-top: 1px solid var(--border-color);
        }

        .glass-header {
            background: rgba(8, 9, 11, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
        }
        html.light .glass-header {
            background: rgba(247, 248, 250, 0.85);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>

        window.showToast = function(message, type = 'success') {
            const existing = document.getElementById('toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-notification';
            const bgCol = type === 'error' ? 'bg-[#F15B65]' : type === 'warning' ? 'bg-[#F5B942]' : 'bg-[#28C78B]';
            toast.className = `fixed bottom-20 right-5 md:bottom-8 md:right-8 z-50 px-4 py-3 rounded-xl text-white text-sm font-medium shadow-2xl flex items-center space-x-2 animate-fade-in ${bgCol}`;

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';

            }, 3500);

        window.navigateTo = function(route) {
            window.location.hash = route;
            window.HAWME_STATE.currentRoute = route;
            renderApp();
            window.scrollTo(0, 0);
        };

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1) || '/';
            window.HAWME_STATE.currentRoute = hash;
            renderApp();
        });

        // Auth state observer
        onAuthStateChanged(auth, async (firebaseUser) => {
            if (firebaseUser) {
                window.HAWME_STATE.currentUser = firebaseUser;
                // Fetch profile from local simulation / database
                const profiles = JSON.parse(localStorage.getItem('hawme_profiles') || '{}');
                let profile = profiles[firebaseUser.uid];
                
                if (!profile) {
                    // Default profile creation if missing
                    profile = {
                        uid: firebaseUser.uid,
                        fullName: firebaseUser.displayName || 'HAWME User',
                        email: firebaseUser.email,
                        role: 'creator',
                        username: firebaseUser.email.split('@')[0],
                        avatar: firebaseUser.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'
                    };
                    profiles[firebaseUser.uid] = profile;
                    localStorage.setItem('hawme_profiles', JSON.stringify(profiles));
                }
                window.HAWME_STATE.userProfile = profile;
            } else {
                window.HAWME_STATE.currentUser = null;
                window.HAWME_STATE.userProfile = null;
            }
            
            const loader = document.getElementById('app-loader');
            if (loader) loader.remove();
            renderApp();
        });

        // ----------------------------------------------------
        // COMPONENT & PAGE RENDERERS

        function renderApp() {
            const appEl = document.getElementById('app');
            const route = window.HAWME_STATE.currentRoute;
            const user = window.HAWME_STATE.currentUser;
            const profile = window.HAWME_STATE.userProfile;

            // Lucide icon refresh helper
            setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 50);

            // Route Protection & Mapping
            if (!user && !['/', '/login', '/register', '/explore'].includes(route) && !route.startsWith('/campaign/') && !route.startsWith('/challenge/')) {
                window.location.hash = '/login';
                return;
            }

            let content = '';

            // Render based on route
            if (route === '/' || route === '') {
                content = renderLandingPage();
            } else if (route === '/login') {
                content = renderLoginPage();
            } else if (route === '/register') {
                content = renderRegisterPage();
            } else if (route === '/onboarding') {
                content = renderOnboardingPage();
            } else if (route === '/explore') {
                content = renderExplorePage();
            } else if (route === '/notifications') {
                content = renderNotificationsPage();
            } else if (route === '/settings') {
                content = renderSettingsPage();
            } else if (route.startsWith('/campaign/')) {
                const id = route.split('/')[2];
                content = renderCampaignDetailPage(id);
            } else if (route.startsWith('/challenge/')) {
                const id = route.split('/')[2];
                content = renderChallengeDetailPage(id);
            } else if (user && profile && profile.role === 'creator') {
                if (route === '/creator/dashboard' || route === '/dashboard') content = renderCreatorDashboard();
                else if (route === '/creator/explore') content = renderExplorePage();
                else if (route === '/creator/applications') content = renderCreatorApplications();
                else if (route === '/creator/analytics') content = renderCreatorAnalytics();
                else if (route === '/creator/profile') content = renderCreatorProfile();
                else content = renderNotFoundPage();
            } else if (user && profile && profile.role === 'brand') {
                if (route === '/brand/dashboard' || route === '/dashboard') content = renderBrandDashboard();
                else if (route === '/brand/campaigns') content = renderBrandCampaigns();
                else if (route === '/brand/campaigns/create') content = renderBrandCreateCampaign();
                else if (route === '/brand/applications') content = renderBrandApplications();
                else if (route === '/brand/analytics') content = renderBrandAnalytics();
                else if (route === '/brand/profile') content = renderBrandProfile();
                else content = renderNotFoundPage();
            } else {
                content = renderLandingPage();
            }

            appEl.innerHTML = content;
            if (window.lucide) lucide.createIcons();
        }

                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-[#9299A5] uppercase tracking-wider mb-2">Description</label>
                                <textarea id="camp-desc" rows="4" required class="w-full px-4 py-3 rounded-xl bg-[#101216] border border-[rgba(255,255,255,0.075)] text-white text-sm" placeholder="Describe the campaign objectives and deliverables..."></textarea>
                            </div>
                            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#FE2C55] to-[#25F4EE] text-white font-bold text-sm shadow-lg hover:opacity-90 transition-opacity">
                                Publish Campaign
                            </button>
                        </form>
                    </div>
                </main>
                ${renderBottomNav()}
            `;
        }

        // --- NOTIFICATIONS PAGE ---
        function renderNotificationsPage() {
            const profile = window.HAWME_STATE.userProfile || {};
            const notifs = JSON.parse(localStorage.getItem('hawme_notifications') || '[]').filter(n => n.userUid === (profile.uid || 'creator_demo'));

            return `
                ${renderNavigationShell()}
                <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-8 pb-24 md:pb-12">
                    <h1 class="text-3xl font-bold text-white mb-6">Notifications</h1>
                    <div class="space-y-3">
                        ${notifs.length === 0 ? '<p class="text-sm text-[#9299A5]">No new notifications.</p>':
                            notifs.map(n => `
                                <div class="p-4 rounded-xl bg-[#14171C] border border-[rgba(255,255,255,0.075)] flex items-start space-x-4">
                                    <div class="w-2 h-2 rounded-full bg-[#25F4EE] mt-2"></div>
                                    <div class="flex-1">
                                        <h4 class="text-sm font-bold text-white mb-1">${n.title}</h4>
                                        <p class="text-sm text-[#9299A5] mb-1">${n.message}</p>
                                        <span class="text-xs text-[#626A76]">${n.time}</span>
                                    </div>
                                </div>
                            `).join('')}
                    </div>
                </main>
                ${renderBottomNav()}
            `;
        }

        // --- NAVIGATION SHELLS ---
        function renderNavigationShell() {
            const user = window.HAWME_STATE.currentUser;
            const profile = window.HAWME_STATE.userProfile;
            const role = profile ? profile.role : 'creator';

            return `
                <header class="glass-header sticky top-0 z-40 w-full px-6 py-4 flex items-center justify-between">
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('/')">
                        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[#FE2C55] to-[#25F4EE] p-0.5 flex items-center justify-center">
                            <div class="w-full h-full bg-[#08090B] rounded-[10px] flex items-center justify-center">
                                <span class="font-extrabold text-white text-lg tracking-tighter">H</span>
                            </div>
                        </div>
                        <span class="font-bold text-xl tracking-tight text-white">HAWME</span>
                    </div>
                    <div class="hidden md:flex items-center space-x-6 text-sm font-medium text-[#9299A5]">
                        <a href="#/${role}/dashboard" class="hover:text-white transition-colors">Dashboard</a>
                        <a href="#/explore" class="hover:text-white transition-colors">Explore</a>
                        <a href="#/notifications" class="hover:text-white transition-colors">Notifications</a>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button onclick="toggleTheme()" class="p-2 rounded-xl bg-[#14171C] border border-[rgba(255,255,255,0.075)] text-[#9299A5] hover:text-white transition-colors">
                            <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                            <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
                        </button>
                        <button onclick="handleLogout()" class="px-3 py-1.5 rounded-xl bg-[#14171C] border border-[rgba(255,255,255,0.075)] text-xs font-semibold text-[#9299A5] hover:text-white transition-colors">
                            Logout
                        </button>
                    </div>
                </header>
            `;
        }

        function renderBottomNav() {
            const profile = window.HAWME_STATE.userProfile || {};
            const role = profile.role || 'creator';
            const route = window.HAWME_STATE.currentRoute;

            return `
                <nav class="md:hidden glass-nav fixed bottom-0 left-0 right-0 h-16 px-6 flex items-center justify-around z-50">
                    <a href="#/${role}/dashboard" class="flex flex-col items-center space-y-1 ${route.includes('dashboard') ? 'text-[#25F4EE]' : 'text-[#9299A5]'}">
                        <i data-lucide="home" class="w-5 h-5"></i>
                        <span class="text-[10px]">Home</span>
                    </a>
                    <a href="#/explore" class="flex flex-col items-center space-y-1 ${route.includes('explore') ? 'text-[#25F4EE]' : 'text-[#9299A5]'}">
                        <i data-lucide="compass" class="w-5 h-5"></i>
                        <span class="text-[10px]">Explore</span>
                    </a>
                    <a href="#/${role === 'brand' ? 'brand/campaigns/create' : 'explore'}" class="flex items-center justify-center w-11 h-11 rounded-full bg-gradient-to-tr from-[#FE2C55] to-[#25F4EE] text-white shadow-lg">
                        <i data-lucide="plus" class="w-6 h-6"></i>
                    </a>
                    <a href="#/notifications" class="flex flex-col items-center space-y-1 ${route.includes('notifications') ? 'text-[#25F4EE]' : 'text-[#9299A5]'}">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                        <span class="text-[10px]">Activity</span>
                    </a>
                    <a href="#/${role}/profile" class="flex flex-col items-center space-y-1 ${route.includes('profile') ? 'text-[#25F4EE]' : 'text-[#9299A5]'}">
                        <i data-lucide="user" class="w-5 h-5"></i>
                        <span class="text-[10px]">Profile</span>
                    </a>
                </nav>
            `;
        }

        function renderNotFoundPage() {
            return `
                <div class="min-h-screen flex flex-col items-center justify-center text-center px-4">
                    <h1 class="text-6xl font-extrabold text-white mb-4">404</h1>
                    <p class="text-sm text-[#9299A5] mb-6">Page not found.</p>
                    <button onclick="navigateTo('/')" class="px-6 py-3 rounded-xl bg-gradient-to-r from-[#FE2C55] to-[#25F4EE] text-white font-bold text-sm">Return Home</button>
                </div>
            `;
        }

        // ----------------------------------------------------
        // ACTION HANDLERS
        // ----------------------------------------------------
        
        window.toggleTheme = function() {
            const current = window.HAWME_STATE.theme;
            const next = current === 'dark' ? 'light' : 'dark';
            window.HAWME_STATE.theme = next;
            localStorage.setItem('hawme_theme', next);

            if (next === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
            }
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;

            try {
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                showToast('Successfully signed in!');
                navigateTo('/dashboard');
            } catch (err) {
                showToast(err.message, 'error');
            }
        };

        window.handleRegister = async function(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                const profiles = JSON.parse(localStorage.getItem('hawme_profiles') || '{}');
                profiles[cred.user.uid] = {
                    uid: cred.user.uid,
                    fullName: name,
                    email: email,
                    role: role,
                    username: email.split('@')[0],
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'
                };
                localStorage.setItem('hawme_profiles', JSON.stringify(profiles));
                showToast('Account created successfully!');
                navigateTo('/onboarding');
            } catch (err) {
                showToast(err.message, 'error');
            }
        };

        window.handleGoogleLogin = async function() {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                const profiles = JSON.parse(localStorage.getItem('hawme_profiles') || '{}');
                if (!profiles[user.uid]) {
                    profiles[user.uid] = {
                        uid: user.uid,
                        fullName: user.displayName || 'HAWME User',
                        email: user.email,
                        role: 'creator',
                        username: user.email.split('@')[0],
                        avatar: user.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'
                    };
                    localStorage.setItem('hawme_profiles', JSON.stringify(profiles));
                }
                showToast('Google authentication successful!');
                navigateTo('/dashboard');
            } catch (err) {
                showToast(err.message, 'error');
            }
        };

        window.handleLogout = async function() {
            await signOut(auth);
            showToast('Signed out successfully.');
            navigateTo('/');
        };

        window.handleOnboarding = function(e) {
            e.preventDefault();
            const user = window.HAWME_STATE.currentUser;
            if (!user) return;

            const profiles = JSON.parse(localStorage.getItem('hawme_profiles') || '{}');
            const profile = profiles[user.uid] || {};

            if (profile.role === 'brand') {
                profile.companyName = document.getElementById('onb-company').value;
                profile.industry = document.getElementById('onb-industry').value;
                profile.website = document.getElementById('onb-website').value;
            } else {
                profile.tiktokUsername = document.getElementById('onb-tiktok').value;
                profile.followers = document.getElementById('onb-followers').value;
                profile.bio = document.getElementById('onb-bio').value;
            }

            profiles[user.uid] = profile;
            localStorage.setItem('hawme_profiles', JSON.stringify(profiles));
            window.HAWME_STATE.userProfile = profile;

            showToast('Onboarding completed!');
            navigateTo('/dashboard');
        };

        window.applyToCampaign = function(campaignId) {
            const user = window.HAWME_STATE.currentUser;
            const profile = window.HAWME_STATE.userProfile;

            if (!user || !profile) {
                navigateTo('/login');
                return;
            }

            const apps = JSON.parse(localStorage.getItem('hawme_applications') || '[]');
            const exists = apps.find(a => a.campaignId === campaignId && a.creatorUid === profile.uid);

            if (exists) {
                showToast('You have already applied to this campaign.', 'warning');
                return;
            }

            apps.push({
                id: 'app_' + Date.now(),
                campaignId: campaignId,
                creatorUid: profile.uid,
                creatorName: profile.fullName,
                status: 'Pending',
                createdAt: new Date().toISOString().split('T')[0]
            });

            localStorage.setItem('hawme_applications', JSON.stringify(apps));
            showToast('Application submitted successfully!');
            navigateTo('/creator/dashboard');
        };

        window.handleCreateCampaign = function(e) {
            e.preventDefault();
            const user = window.HAWME_STATE.currentUser;
            const profile = window.HAWME_STATE.userProfile;

            const campaigns = JSON.parse(localStorage.getItem('hawme_campaigns') || '[]');
            const newCamp = {
                id: 'camp_' + Date.now(),
                brandUid: profile.uid,
                brandName: profile.companyName || profile.fullName,
                brandLogo: profile.avatar,
                verified: profile.verified || false,
                title: document.getElementById('camp-title').value,
                category: document.getElementById('camp-category').value,
                type: document.getElementById('camp-type').value,
                reward: document.getElementById('camp-reward').value,
                deadline: '2026-05-01',
                slots: 10,
                slotsFilled: 0,
                description: document.getElementById('camp-desc').value,
                requirements: 'Standard community guidelines apply.',
                status: 'active'
            };

            campaigns.unshift(newCamp);
            localStorage.setItem('hawme_campaigns', JSON.stringify(campaigns));
            showToast('Campaign published successfully!');
            navigateTo('/brand/dashboard');
        };

        // Initial render execution
        renderApp();
    </script>
</body>
</html>
