<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HAWME — Connect. Collaborate. Grow.</title>
<meta name="description" content="HAWME 2.0 — Creator and company collaboration marketplace. Discover opportunities, work with brands, and turn your creativity into meaningful collaborations.">
<meta name="theme-color" content="#080A09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<style>
/* ==========================================================================
   2. CSS VARIABLES & DESIGN TOKENS
   ========================================================================== */
:root {
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  --nav-mobile-height: 68px;
  --sidebar-width: 260px;
  --header-height: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --transition-fast: 160ms cubic-bezier(0.22, 1, 0.36, 1);
  --transition-base: 240ms cubic-bezier(0.22, 1, 0.36, 1);
}

/* DARK THEME — PREMIUM BLACK AND GOLD */
[data-theme="dark"] {
  --bg-main: #080A09;
  --bg-secondary: #0D100E;
  --bg-card: #121612;
  --bg-elevated: #181E19;
  --bg-floating: #1D241E;

  --text-primary: #F5F5EF;
  --text-secondary: #A4AAA0;
  --text-muted: #737B70;

  --accent-main: #D6B36A;
  --accent-bright: #E8CA87;
  --accent-soft: #C7AD78;
  --accent-dark: #927342;

  --border-accent: rgba(214, 179, 106, 0.20);
  --border-normal: rgba(255, 255, 255, 0.075);

  --status-success: #43B987;
  --status-warning: #E8B65C;
  --status-error: #DF7272;
  --status-info: #85A9D4;

  --btn-primary-bg: rgba(214, 179, 106, 0.14);
  --btn-primary-bg-hover: rgba(214, 179, 106, 0.22);
  --btn-primary-border: rgba(214, 179, 106, 0.36);
  --btn-primary-text: #F5F5EF;

  --btn-secondary-bg: rgba(255, 255, 255, 0.03);
  --btn-secondary-bg-hover: rgba(255, 255, 255, 0.07);
  --btn-secondary-border: rgba(255, 255, 255, 0.10);
  --btn-secondary-text: #F5F5EF;

  --nav-backdrop: rgba(8, 10, 9, 0.86);
  --chip-accent-bg: rgba(214, 179, 106, 0.12);
  --chip-accent-text: #E8CA87;
  --verified-color: #60A5FA;
  --atmosphere-top: radial-gradient(ellipse 85% 420px at 50% -60px, rgba(214, 179, 106, 0.14), rgba(146, 115, 66, 0.04) 55%, transparent 80%);
  --atmosphere-edge: radial-gradient(circle at 95% 22%, rgba(214, 179, 106, 0.05), transparent 45%);
}

/* LIGHT THEME — WHITE AND SAGE GREEN */
[data-theme="light"] {
  --bg-main: #F7FAF6;
  --bg-secondary: #F0F5EF;
  --bg-card: #FFFFFF;
  --bg-elevated: #FFFFFF;
  --bg-floating: #FFFFFF;

  --text-primary: #17221B;
  --text-secondary: #647369;
  --text-muted: #89968D;

  --accent-main: #588B6C;
  --accent-bright: #76A889;
  --accent-soft: #DCEDE0;
  --accent-dark: #315C42;

  --border-accent: rgba(88, 139, 108, 0.28);
  --border-normal: #E4EBE4;

  --status-success: #438B62;
  --status-warning: #BD873D;
  --status-error: #CE6969;
  --status-info: #4D7CB8;

  --btn-primary-bg: rgba(118, 168, 137, 0.18);
  --btn-primary-bg-hover: rgba(118, 168, 137, 0.28);
  --btn-primary-border: rgba(88, 139, 108, 0.38);
  --btn-primary-text: #315C42;

  --btn-secondary-bg: rgba(23, 34, 27, 0.02);
  --btn-secondary-bg-hover: rgba(23, 34, 27, 0.05);
  --btn-secondary-border: #E4EBE4;
  --btn-secondary-text: #17221B;

  --nav-backdrop: rgba(247, 250, 246, 0.88);
  --chip-accent-bg: #EAF3EA;
  --chip-accent-text: #315C42;
  --verified-color: #2563EB;
  --atmosphere-top: radial-gradient(ellipse 85% 420px at 50% -60px, rgba(118, 168, 137, 0.20), rgba(220, 237, 224, 0.12) 55%, transparent 80%);
  --atmosphere-edge: radial-gradient(circle at 95% 22%, rgba(118, 168, 137, 0.12), transparent 45%);
}

/* ==========================================================================
   3. THEME STYLES & ATMOSPHERIC LIGHTING
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  min-height: 100%;
  background-color: var(--bg-main);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  transition: background-color var(--transition-base), color var(--transition-base);
}

.atmosphere-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image: var(--atmosphere-top), var(--atmosphere-edge);
}

/* ==========================================================================
   4. GLOBAL STYLES & TYPOGRAPHY
   ========================================================================== */
h1, h2, h3, h4 {
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

h1 { font-size: clamp(1.5rem, 2.5vw, 2rem); line-height: 1.2; }
h2 { font-size: clamp(1.2rem, 2vw, 1.45rem); line-height: 1.25; }
h3 { font-size: 1.05rem; line-height: 1.35; }
h4 { font-size: 0.9375rem; line-height: 1.4; }

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; color: inherit; }

.text-secondary { color: var(--text-secondary); }
.text-muted { color: var(--text-muted); }
.text-accent { color: var(--accent-main); }
.text-success { color: var(--status-success); }
.text-warning { color: var(--status-warning); }
.text-error { color: var(--status-error); }
.text-xs { font-size: 0.75rem; }
.text-sm { font-size: 0.84rem; }
.font-medium { font-weight: 500; }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-normal); border-radius: 99px; }

/* ==========================================================================
   5. COMPONENT STYLES
   ========================================================================== */
.app-shell {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
}

/* Desktop Sidebar */
.desktop-sidebar {
  display: none;
  width: var(--sidebar-width);
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-normal);
  padding: 24px 16px;
  flex-direction: column;
  justify-content: space-between;
  z-index: 40;
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 10px;
  cursor: pointer;
}

.brand-emblem {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  background: var(--btn-primary-bg);
  border: 1px solid var(--border-accent);
  display: grid;
  place-items: center;
  color: var(--accent-main);
  font-weight: 800;
  font-size: 16px;
  letter-spacing: -0.04em;
}

.brand-title {
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: 0.06em;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 28px;
}

.sidebar-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 0.92rem;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: all var(--transition-fast);
  text-align: left;
  width: 100%;
}

.sidebar-link:hover {
  background: var(--btn-secondary-bg-hover);
  color: var(--text-primary);
}

.sidebar-link.active {
  background: var(--btn-primary-bg);
  border-color: var(--border-accent);
  color: var(--accent-main);
  font-weight: 600;
}

/* Main Viewport Container */
.main-content {
  flex: 1;
  width: 100%;
  padding-bottom: calc(var(--nav-mobile-height) + var(--safe-bottom) + 24px);
}

.page-container {
  max-width: 1140px;
  margin: 0 auto;
  padding: 16px 16px 32px;
}

.page-container-narrow {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px 16px 32px;
}

/* Mobile Top Bar */
.mobile-topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 56px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--nav-backdrop);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-normal);
}

/* Mobile Bottom Nav */
.mobile-bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(var(--nav-mobile-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--nav-backdrop);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border-normal);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
  z-index: 45;
}

.mobile-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 100%;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 10.5px;
  font-weight: 500;
  cursor: pointer;
  position: relative;
  transition: color var(--transition-fast);
}

.mobile-nav-item.active {
  color: var(--accent-main);
  font-weight: 600;
}

.mobile-nav-item.active::after {
  content: '';
  position: absolute;
  top: 0;
  width: 22px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent-main);
}

.company-create-fab {
  width: 44px;
  height: 36px;
  border-radius: 13px;
  background: var(--btn-primary-bg);
  border: 1px solid var(--btn-primary-border);
  color: var(--accent-main);
  display: grid;
  place-items: center;
  transition: transform var(--transition-fast), background var(--transition-fast);
}

.mobile-nav-item:active .company-create-fab {
  transform: scale(0.94);
}

/* Transparent Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--transition-fast);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  white-space: nowrap;
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--btn-primary-bg);
  border-color: var(--btn-primary-border);
  color: var(--btn-primary-text);
}

.btn-primary:hover:not(:disabled) {
  background: var(--btn-primary-bg-hover);
  border-color: var(--accent-main);
}

.btn-secondary {
  background: var(--btn-secondary-bg);
  border-color: var(--btn-secondary-border);
  color: var(--btn-secondary-text);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--btn-secondary-bg-hover);
}

.btn-danger {
  background: rgba(223, 114, 114, 0.12);
  border-color: rgba(223, 114, 114, 0.32);
  color: var(--status-error);
}

.btn-sm {
  padding: 7px 13px;
  font-size: 0.81rem;
  border-radius: 12px;
}

.btn-lg {
  padding: 13px 24px;
  font-size: 0.96rem;
  border-radius: 14px;
}

.btn-full { width: 100%; }

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--btn-secondary-bg);
  border: 1px solid var(--border-normal);
  display: inline-grid;
  place-items: center;
  color: var(--text-primary);
  cursor: pointer;
  transition: all var(--transition-fast);
  position: relative;
}

.icon-btn:hover {
  background: var(--btn-secondary-bg-hover);
  border-color: var(--border-accent);
}

/* Surfaces & Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-normal);
  border-radius: var(--radius-md);
  padding: 18px;
  transition: border-color var(--transition-fast), transform var(--transition-fast);
}

.card-interactive {
  cursor: pointer;
}

.card-interactive:hover {
  border-color: var(--border-accent);
}

.card-elevated {
  background: var(--bg-elevated);
  border: 1px solid var(--border-normal);
  border-radius: var(--radius-md);
  padding: 18px;
}

/* Alibaba-inspired Campaign & Challenge Product Cards */
.promo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.promo-card {
  background: var(--bg-card);
  border: 1px solid var(--border-normal);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: border-color var(--transition-fast), transform var(--transition-fast);
}

.promo-card:hover {
  border-color: var(--border-accent);
  transform: translateY(-2px);
}

.promo-cover-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  background: var(--bg-elevated);
  overflow: hidden;
}

.promo-cover-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.promo-cover-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  background: rgba(8, 10, 9, 0.76);
  color: #F5F5EF;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.promo-reward-pill {
  position: absolute;
  bottom: 10px;
  right: 10px;
  padding: 5px 11px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  background: rgba(8, 10, 9, 0.84);
  color: #E8CA87;
  border: 1px solid rgba(214, 179, 106, 0.35);
  backdrop-filter: blur(8px);
}

.promo-body {
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.company-inline {
  display: flex;
  align-items: center;
  gap: 8px;
}

.avatar-xs {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--bg-elevated);
  border: 1px solid var(--border-normal);
  flex-shrink: 0;
}

.avatar-sm {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--bg-elevated);
  border: 1px solid var(--border-normal);
  flex-shrink: 0;
}

.avatar-md {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--bg-elevated);
  border: 1px solid var(--border-accent);
  flex-shrink: 0;
}

.avatar-lg {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--bg-elevated);
  border: 2px solid var(--border-accent);
  flex-shrink: 0;
}

.verified-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--verified-color);
  flex-shrink: 0;
}

/* Badges & Chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 600;
  background: var(--btn-secondary-bg);
  border: 1px solid var(--border-normal);
  color: var(--text-secondary);
}

.chip-accent {
  background: var(--chip-accent-bg);
  border-color: var(--border-accent);
  color: var(--chip-accent-text);
}

.chip-success {
  background: rgba(67, 185, 135, 0.12);
  border-color: rgba(67, 185, 135, 0.28);
  color: var(--status-success);
}

.chip-warning {
  background: rgba(232, 182, 92, 0.12);
  border-color: rgba(232, 182, 92, 0.28);
  color: var(--status-warning);
}

.chip-error {
  background: rgba(223, 114, 114, 0.12);
  border-color: rgba(223, 114, 114, 0.28);
  color: var(--status-error);
}

.chip-info {
  background: rgba(133, 169, 212, 0.12);
  border-color: rgba(133, 169, 212, 0.28);
  color: var(--status-info);
}

/* Forms */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 15px;
}

.form-label {
  font-size: 0.83rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  border: 1px solid var(--border-normal);
  color: var(--text-primary);
  font-size: 0.92rem;
  outline: none;
  transition: border-color var(--transition-fast);
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent-main);
}

.form-textarea {
  min-height: 92px;
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* Horizontal Scroll Rows */
.h-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: none;
}
.h-scroll::-webkit-scrollbar { display: none; }

.filter-pill {
  padding: 7px 14px;
  border-radius: 99px;
  background: var(--btn-secondary-bg);
  border: 1px solid var(--border-normal);
  color: var(--text-secondary);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition-fast);
}

.filter-pill.active {
  background: var(--btn-primary-bg);
  border-color: var(--border-accent);
  color: var(--accent-main);
}

/* Tabs */
.tabs-bar {
  display: flex;
  border-bottom: 1px solid var(--border-normal);
  gap: 8px;
  margin-bottom: 18px;
}

.tab-btn {
  padding: 10px 16px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.tab-btn.active {
  color: var(--accent-main);
  border-bottom-color: var(--accent-main);
}

/* TikTok-Inspired Creator Profile */
.tiktok-profile-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0 18px;
}

.tiktok-profile-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.tiktok-stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  width: 100%;
  max-width: 340px;
  margin: 16px auto;
  padding: 10px 0;
  border-top: 1px solid var(--border-normal);
  border-bottom: 1px solid var(--border-normal);
}

.tiktok-stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  border-right: 1px solid var(--border-normal);
}

.tiktok-stat-item:last-child { border-right: none; }
.tiktok-stat-num { font-size: 1.12rem; font-weight: 700; color: var(--text-primary); }
.tiktok-stat-lbl { font-size: 0.74rem; color: var(--text-secondary); }

/* Leaderboard Podium */
.podium-stage {
  display: grid;
  grid-template-columns: 1fr 1.12fr 1fr;
  align-items: flex-end;
  gap: 10px;
  margin: 24px 0 28px;
  padding-top: 12px;
}

.podium-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.podium-pedestal {
  width: 100%;
  border-radius: 16px 16px 12px 12px;
  border: 1px solid var(--border-normal);
  background: var(--bg-card);
  padding: 14px 8px;
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.podium-1 .podium-pedestal {
  min-height: 132px;
  border-color: rgba(214, 179, 106, 0.42);
  background: linear-gradient(180deg, rgba(214, 179, 106, 0.16), var(--bg-card));
}

.podium-2 .podium-pedestal {
  min-height: 104px;
  border-color: rgba(188, 198, 204, 0.35);
  background: linear-gradient(180deg, rgba(188, 198, 204, 0.11), var(--bg-card));
}

.podium-3 .podium-pedestal {
  min-height: 88px;
  border-color: rgba(184, 128, 84, 0.35);
  background: linear-gradient(180deg, rgba(184, 128, 84, 0.11), var(--bg-card));
}

/* Progress Bars & Timelines */
.progress-track {
  width: 100%;
  height: 8px;
  border-radius: 99px;

async function getTrustedHeaders() {
  const user = auth.currentUser;

/* ==========================================================================

const state = {

function setTheme(theme) {
  state.theme = theme;
  localStorage.setItem("hawme_theme", theme);
  document.documentElement.setAttribute("data-theme", theme);
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute("content", theme === "dark" ? "#080A09" : "#F7FAF6");
  renderApp();
}
document.documentElement.setAttribute("data-theme", state.theme);

function showToast(message, type = "info") {
  const root = document.getElementById("toast-root");
  if (!root) return;
  const el = document.createElement("div");
  el.className = "toast-item";
  const borderCol = type === "error" ? "var(--status-error)"
    : type === "success" ? "var(--status-success)"
    : "var(--border-accent)";
  el.style.borderColor = borderCol;
  el.innerHTML = `<span>${escapeHtml(message)}</span><button style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-weight:700;">✕</button>`;
  el.querySelector("button").onclick = () => el.remove();
  root.appendChild(el);
  setTimeout(() => el.remove(), 4600);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatNumber(n) {
  const num = Number(n || 0);
  if (num >= 1_000_000) return (num / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
  if (num >= 1_000) return (num / 1_000).toFixed(1).replace(/\.0$/, "") + "K";
  return num.toLocaleString();
}

function formatCurrency(amount, currency = "ETB") {
  if (amount === null || amount === undefined || amount === "") return "Not specified";
  return `${Number(amount).toLocaleString()} ${currency}`;
}

function formatDate(iso) {
  if (!iso) return "TBD";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function verifiedBadgeHtml(isVerified) {
  if (!isVerified) return "";
  return `<span class="verified-badge" title="Verified HAWME Account" aria-label="Verified"><i data-lucide="badge-check" style="width:16px;height:16px;"></i></span>`;
}

/* ==========================================================================
   11. CLIENT-SIDE ROUTING
   ========================================================================== */
function navigate(path) {
  if (state.route === path) return;
  cleanupRealtime();
  window.history.pushState({}, "", path);
  state.route = path;
  window.scrollTo({ top: 0, behavior: "smooth" });
  onRouteEnter(path);
  renderApp();
}

window.addEventListener("popstate", () => {
  cleanupRealtime();
  state.route = window.location.pathname || "/";
  onRouteEnter(state.route);
  renderApp();
});

function matchRoute(pattern, path) {
  const pParts = pattern.split("/").filter(Boolean);
  const uParts = path.split("/").filter(Boolean);
  if (pParts.length !== uParts.length) return null;
  const params = {};
  for (let i = 0; i < pParts.length; i++) {
    if (pParts[i].startsWith(":")) {
      params[pParts[i].slice(1)] = decodeURIComponent(uParts[i]);
    } else if (pParts[i] !== uParts[i]) {
      return null;
    }
  }
  return params;
}

/* ==========================================================================
   12. STORAGE & CLOUDFLARE R2 + SUPABASE STORAGE UPLOAD SERVICE
   ========================================================================== */
async function uploadMediaFile(file, folder = "general", onProgress = null) {
  if (!file) throw new Error("No file selected.");
  const allowed = ["image/jpeg", "image/png", "image/webp", "image/gif"];
  if (!allowed.includes(file.type)) {
    throw new Error("Unsupported format. Please upload JPG, PNG, or WEBP.");
  }
  if (file.size > 8 * 1024 * 1024) {
    throw new Error("Image exceeds 8MB maximum limit.");
  }

  if (onProgress) onProgress(20);
  const ext = file.name.split(".").pop() || "jpg";
  const uid = state.firebaseUser?.uid || "anon";
  const path = `${folder}/${uid}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;

  // Primary: Cloudflare R2 secure Worker endpoint
  try {
    const headers = await getTrustedHeaders();
    delete headers["Content-Type"];
    const formData = new FormData();
    formData.append("file", file);
    formData.append("path", path);

    const res = await fetch(APP_CONFIG.cloudflare.workerUploadUrl, {
      method: "POST",
      headers,
      body: formData
    });
    if (res.ok) {
      const json = await res.json();
      if (onProgress) onProgress(100);
      if (json.url) return json.url;
    }
  } catch (_) {
    // Fallback to configured Supabase Storage bucket if Worker endpoint is offline
  }

  if (onProgress) onProgress(55);
  const { error: upErr } = await supabase.storage
    .from(APP_CONFIG.supabase.bucket)
    .upload(path, file, { upsert: true, contentType: file.type });

  if (upErr) {
    throw new Error(`Storage upload failed: ${upErr.message}`);
  }
  if (onProgress) onProgress(100);
  const { data } = supabase.storage.from(APP_CONFIG.supabase.bucket).getPublicUrl(path);
  return data.publicUrl;
}

/* ==========================================================================
   13. PROFILE & AUTHENTICATION SERVICES
   ========================================================================== */
async function loadCurrentUserAccount(fbUser) {
  if (!fbUser) {
    state.profile = null;
    state.creatorProfile = null;
    state.companyProfile = null;
    return;
  }

  const { data: prof } = await supabase
    .from("profiles")
    .select("*")
    .eq("firebase_uid", fbUser.uid)
    .maybeSingle();

  state.profile = prof || null;

  if (prof?.account_type === "creator") {
    const { data: cp } = await supabase
      .from("creator_profiles")
      .select("*")
      .eq("profile_id", prof.id)
      .maybeSingle();
    state.creatorProfile = cp || null;
    state.companyProfile = null;
  } else if (prof?.account_type === "company") {
    const { data: comp } = await supabase
      .from("company_profiles")
      .select("*")
      .eq("profile_id", prof.id)
      .maybeSingle();
    state.companyProfile = comp || null;
    state.creatorProfile = null;
  }
}

async function registerWithEmail(email, password, accountType) {
  const cred = await createUserWithEmailAndPassword(auth, email, password);
  await sendEmailVerification(cred.user).catch(() => {});
  const { data: prof, error } = await supabase
    .from("profiles")
    .upsert({
      firebase_uid: cred.user.uid,
      email: cred.user.email,
      account_type: accountType,
      onboarding_completed: false
    }, { onConflict: "firebase_uid" })
    .select()
    .single();

  if (error) throw error;
  state.profile = prof;
  return prof;
}

async function loginWithEmail(email, password) {
  const cred = await signInWithEmailAndPassword(auth, email, password);
  await loadCurrentUserAccount(cred.user);
  return state.profile;
}

async function authenticateWithGoogle(preferredRole = null) {
  const cred = await signInWithPopup(auth, googleProvider);
  await loadCurrentUserAccount(cred.user);
  if (!state.profile) {
    const role = preferredRole || state.selectedRegRole;
    if (!role) {
      navigate("/register");
      return null;
    }
    const { data: prof, error } = await supabase
      .from("profiles")
      .insert({
        firebase_uid: cred.user.uid,
        email: cred.user.email,
        account_type: role,
        onboarding_completed: false
      })
      .select()
      .single();
    if (error) throw error;
    state.profile = prof;
  }
  return state.profile;
}

async function handleLogout() {
  cleanupRealtime();
  await signOut(auth);
  state.firebaseUser = null;
  state.profile = null;
  state.creatorProfile = null;
  state.companyProfile = null;
  navigate("/");
  showToast("Signed out of HAWME.");
}

async function isUsernameAvailable(username, excludeProfileId = null) {
  const clean = username.trim().toLowerCase().replace(/^@/, "");
  if (!clean || clean.length < 3) return false;
  const [{ data: cData }, { data: coData }] = await Promise.all([
    supabase.from("creator_profiles").select("profile_id").eq("username", clean),
    supabase.from("company_profiles").select("profile_id").eq("username", clean)
  ]);
  const takenCreator = (cData || []).some(r => r.profile_id !== excludeProfileId);
  const takenCompany = (coData || []).some(r => r.profile_id !== excludeProfileId);
  return !takenCreator && !takenCompany;
}

async function saveCreatorProfile(payload) {
  if (!state.profile) throw new Error("Not authenticated.");
  const cleanUser = payload.username.trim().toLowerCase().replace(/^@/, "");
  const available = await isUsernameAvailable(cleanUser, state.profile.id);
  if (!available) throw new Error("This username is already taken.");

  const record = {
    profile_id: state.profile.id,
    firebase_uid: state.firebaseUser.uid,
    full_name: payload.full_name.trim(),
    username: cleanUser,
    avatar_url: payload.avatar_url || DEFAULT_AVATAR,
    bio: payload.bio.trim(),
    country: payload.country.trim(),
    city: payload.city.trim(),
    tiktok_username: payload.tiktok_username.trim().replace(/^@/, ""),
    tiktok_url: payload.tiktok_url.trim(),
    instagram_username: (payload.instagram_username || "").trim().replace(/^@/, ""),
    youtube_username: (payload.youtube_username || "").trim().replace(/^@/, ""),
    follower_count: Number(payload.follower_count || 0),
    categories: payload.categories || [],
    languages: payload.languages || [],
    advertised_rate: payload.advertised_rate ? Number(payload.advertised_rate) : null,
    rate_currency: "ETB"
  };

  const { data: saved, error } = await supabase
    .from("creator_profiles")
    .upsert(record, { onConflict: "profile_id" })
    .select()
    .single();
  if (error) throw error;

  await supabase.from("profiles").update({ onboarding_completed: true }).eq("id", state.profile.id);
  state.profile.onboarding_completed = true;
  state.creatorProfile = saved;
  return saved;
}

async function saveCompanyProfile(payload) {
  if (!state.profile) throw new Error("Not authenticated.");
  const cleanUser = payload.username.trim().toLowerCase().replace(/^@/, "");
  const available = await isUsernameAvailable(cleanUser, state.profile.id);
  if (!available) throw new Error("This company username is already taken.");

  const record = {
    profile_id: state.profile.id,
    firebase_uid: state.firebaseUser.uid,
    company_name: payload.company_name.trim(),
    username: cleanUser,
    logo_url: payload.logo_url || DEFAULT_LOGO,
    description: payload.description.trim(),
    industry: payload.industry,
    country: payload.country.trim(),
    city: payload.city.trim(),
    website: payload.website.trim(),
    business_email: payload.business_email.trim(),
    contact_details: payload.contact_details.trim()
  };

  const { data: saved, error } = await supabase
    .from("company_profiles")
    .upsert(record, { onConflict: "profile_id" })
    .select()
    .single();
  if (error) throw error;

  await supabase.from("profiles").update({ onboarding_completed: true }).eq("id", state.profile.id);
  state.profile.onboarding_completed = true;
  state.companyProfile = saved;
  return saved;
}

/* ==========================================================================
   14-21. DOMAIN SERVICES (CAMPAIGNS, CHALLENGES, APPS, VIDEOS, PAYMENTS, ETC.)
   ========================================================================== */
async function fetchMarketplaceData() {
  const [campRes, chalRes, creaRes, compRes, postRes] = await Promise.all([
    supabase
      .from("campaigns")
      .select("*, company_profiles(id, company_name, username, logo_url, is_verified, country, city), campaign_requirements(*)")
      .eq("status", "published")
      .order("created_at", { ascending: false }),
    supabase
      .from("challenges")
      .select("*, company_profiles(id, company_name, username, logo_url, is_verified), challenge_prizes(*), challenge_participants(id, creator_profile_id)")
      .in("status", ["published", "active"])
      .order("created_at", { ascending: false }),
    supabase
      .from("creator_profiles")
      .select("*")
      .order("follower_count", { ascending: false }),
    supabase
      .from("company_profiles")
      .select("*")
      .order("created_at", { ascending: false }),
    supabase
      .from("social_posts")
      .select("*, social_post_likes(profile_id), social_post_comments(id, content, created_at, profiles(email, account_type, creator_profiles(username, avatar_url), company_profiles(company_name, logo_url)))")
      .order("created_at", { ascending: false })
  ]);

  state.campaigns = campRes.data || [];
  state.challenges = chalRes.data || [];
  state.creators = creaRes.data || [];
  state.companies = compRes.data || [];
  state.communityPosts = postRes.data || [];

  // Transparent deterministic leaderboard scoring based strictly on real database metrics
  state.leaderboardCreators = [...state.creators]
    .map(c => {
      const completed = Number(c.completed_promotions || 0);
      const views = Number(c.total_tracked_views || 0);
      const followers = Number(c.follower_count || 0);
      const score = Math.round((completed * 250) + (views / 1000) + (followers / 500));
      return { ...c, ranking_score: score };
    })
    .sort((a, b) => b.ranking_score - a.ranking_score);
}

async function fetchUserActivityData() {
  if (!state.profile) return;

  const { data: notifs } = await supabase
    .from("notifications")
    .select("*")
    .eq("recipient_profile_id", state.profile.id)
    .order("created_at", { ascending: false });
  state.notifications = notifs || [];

  if (state.profile.account_type === "creator" && state.creatorProfile) {
    const { data: apps } = await supabase
      .from("applications")
      .select("*, campaigns(*, company_profiles(company_name, username, logo_url, is_verified), campaign_requirements(*)), collaboration_agreements(*), video_submissions(*, campaign_metrics(*)), payments(*, withdrawals(*))")
      .eq("creator_profile_id", state.creatorProfile.id)
      .order("created_at", { ascending: false });
    state.myApplications = apps || [];
  }

  if (state.profile.account_type === "company" && state.companyProfile) {
    const { data: offers } = await supabase
      .from("campaigns")
      .select("*, campaign_requirements(*), applications(*, creator_profiles(*), collaboration_agreements(*), video_submissions(*, campaign_metrics(*)), payments(*))")
      .eq("company_profile_id", state.companyProfile.id)
      .order("created_at", { ascending: false });
    state.companyOffers = offers || [];
  }
}

async function createNotification(recipientProfileId, title, body, linkRoute) {
  await supabase.from("notifications").insert({
    recipient_profile_id: recipientProfileId,
    title,
    body,
    link_route: linkRoute,
    is_read: false
  });
}

async function applyToCampaign(campaignId, message, creativeIdea) {
  if (!state.creatorProfile) throw new Error("Creator profile required.");
  const { data: camp } = await supabase
    .from("campaigns")
    .select("*, company_profiles(profile_id, company_name)")
    .eq("id", campaignId)
    .single();
  if (!camp) throw new Error("Campaign not found.");

  const { data: app, error } = await supabase
    .from("applications")
    .insert({
      campaign_id: campaignId,
      creator_profile_id: state.creatorProfile.id,
      message: message.trim(),
      creative_idea: creativeIdea.trim(),
      status: "Under Review"
    })
    .select()
    .single();
  if (error) throw error;

  await createNotification(
    state.profile.id,
    "Application Received",
    `Your application for "${camp.title}" is now Under Review.`,
    `/creator/applications/${app.id}`
  );
  if (camp.company_profiles?.profile_id) {
    await createNotification(

async function submitCreatorWithdrawalRequest(paymentId, providerName, accountHolder, accountIdentifier) {
  if (!state.creatorProfile) throw new Error("Unauthorized");
  const { data: pay } = await supabase
    .from("payments")
    .select("*")
    .eq("id", paymentId)
    .eq("creator_profile_id", state.creatorProfile.id)
    .single();
  if (!pay) throw new Error("Payment record not found.");
  if (pay.status !== "Awaiting Payment Information") {
    throw new Error("Payment is not yet eligible for withdrawal details.");
  }

  // Save private payout destination in restricted payment_methods table (never public profile)
  const { data: pm, error: pmErr } = await supabase
    .from("payment_methods")
    .insert({
      creator_profile_id: state.creatorProfile.id,
      provider_name: providerName,
      account_holder_name: accountHolder.trim(),
      account_identifier: accountIdentifier.trim()
    })
    .select()
    .single();
  if (pmErr) throw pmErr;

  const { error: wErr } = await supabase.from("withdrawals").insert({
    payment_id: paymentId,
    creator_profile_id: state.creatorProfile.id,
    payment_method_id: pm.id,
    amount: pay.amount,
    currency: pay.currency,
    status: "Withdrawal In Progress"
  });
  if (wErr) throw wErr;

  await supabase
    .from("payments")
    .update({ status: "Withdrawal In Progress" })
    .eq("id", paymentId);

  await createNotification(
    state.profile.id,
    "Withdrawal In Progress",
    `Your withdrawal request for ${formatCurrency(pay.amount, pay.currency)} has been queued for administrator payout processing.`,
    "/creator/payments"
  );
}

async function generateCreatorVerificationRequest(tiktokUsername) {
  const cleanTikTok = tiktokUsername.trim().replace(/^@/, "");
  if (!cleanTikTok) throw new Error("Enter your TikTok username.");

  // Request backend verification code generation via Edge Function / Worker, with cryptographic fallback
  let code = null;
  const now = new Date();
  const expires = new Date(now.getTime() + 3 * 60 * 60 * 1000); // 3 hours

  try {
    const headers = await getTrustedHeaders();
    const res = await fetch(`${APP_CONFIG.supabase.url}/functions/v1/generate-verification-code`, {
      method: "POST",
      headers,
      body: JSON.stringify({
        firebase_uid: state.firebaseUser.uid,
        tiktok_username: cleanTikTok
      })
    });
    if (res.ok) {
      const json = await res.json();
      code = json.verification_code;
    }
  } catch (_) {}

  if (!code) {
    const arr = new Uint8Array(4);
    crypto.getRandomValues(arr);
    const token = Array.from(arr, b => b.toString(36).toUpperCase().padStart(2, "0")).join("").slice(0, 6);
    code = `HAWME-VERIFY-${token}`;
  }

  const { data: reqRow, error } = await supabase
    .from("creator_verification_requests")
    .insert({
      creator_profile_id: state.creatorProfile.id,
      firebase_uid: state.firebaseUser.uid,
      tiktok_username: cleanTikTok,
      verification_code: code,
      status: "Code Issued",
      expires_at: expires.toISOString()
    })
    .select()
    .single();
  if (error) throw error;
  return reqRow;
}

async function confirmVerificationCodePlaced(requestId) {
  const { data: reqRow } = await supabase
    .from("creator_verification_requests")
    .select("*")
    .eq("id", requestId)
    .single();
  if (!reqRow) throw new Error("Verification request not found.");
  if (new Date(reqRow.expires_at).getTime() < Date.now()) {
    throw new Error("This verification code has expired. Please generate a new code.");
  }

  // Trigger backend bio check & transition to Under Review (never auto-approve)
  try {
    const headers = await getTrustedHeaders();
    await fetch(`${APP_CONFIG.supabase.url}/functions/v1/check-tiktok-bio`, {
      method: "POST",
      headers,
      body: JSON.stringify({ request_id: requestId })
    });
  } catch (_) {}

  const { error } = await supabase
    .from("creator_verification_requests")
    .update({ status: "Under Review", submitted_at: new Date().toISOString() })
    .eq("id", requestId);
  if (error) throw error;

  await createNotification(
    state.profile.id,
    "Verification Request Under Review",
    "Your TikTok ownership evidence has been submitted for administrator review.",
    "/creator/verification"
  );
}

function cleanupRealtime() {
  for (const ch of state.realtimeChannels) {
    supabase.removeChannel(ch);
  }
  state.realtimeChannels = [];
}

function subscribeUserRealtime() {
  if (!state.profile) return;
  const notifCh = supabase
    .channel(`notifs-${state.profile.id}`)
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "notifications",
      filter: `recipient_profile_id=eq.${state.profile.id}`
    }, payload => {
      state.notifications.unshift(payload.new);
      showToast(payload.new.title);
      renderApp();
    })
    .subscribe();
  state.realtimeChannels.push(notifCh);
}

  await fetchMarketplaceData();
  if (state.profile) {
    await fetchUserActivityData();
    subscribeUserRealtime();
  }
}

// 13. APPLICATION DETAILS, VIDEO SUBMISSION & CAMPAIGN PROGRESS + PAYMENT TIMELINE
function renderCreatorApplicationDetailPage(appId) {
  const app = state.myApplications.find(a => a.id === appId);
  if (!app) {
    return `<div class="page-container-narrow"><div class="card">Application not found.</div></div>`;
  }

  const camp = app.campaigns || {};
  const comp = camp.company_profiles || {};
  const reqs = Array.isArray(camp.campaign_requirements) ? camp.campaign_requirements[0] : camp.campaign_requirements;
  const agreement = Array.isArray(app.collaboration_agreements) ? app.collaboration_agreements[0] : app.collaboration_agreements;
  const submission = Array.isArray(app.video_submissions) ? app.video_submissions[0] : app.video_submissions;
  const metrics = submission?.campaign_metrics?.[0] || null;
  const payment = Array.isArray(app.payments) ? app.payments[0] : app.payments;

  const reqViews = Number(reqs?.min_views || 0);
  const reqLikes = Number(reqs?.min_likes || 0);
  const curViews = Number(metrics?.views_count || 0);
  const curLikes = Number(metrics?.likes_count || 0);
  const viewsPct = reqViews > 0 ? Math.min(100, Math.round((curViews / reqViews) * 100)) : 100;
  const likesPct = reqLikes > 0 ? Math.min(100, Math.round((curLikes / reqLikes) * 100)) : 100;
  const thresholdsMet = (!reqViews || curViews >= reqViews) && (!reqLikes || curLikes >= reqLikes);

  return `
    <div class="page-container-narrow">
      <button class="btn btn-secondary btn-sm" data-nav="/creator/activity" style="margin-bottom:14px;">← Back to Activity</button>

      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;">
          <div class="company-inline">
            <img src="${escapeHtml(comp.logo_url || DEFAULT_LOGO)}" alt="" class="avatar-sm">
            <div>
              <div class="font-bold">${escapeHtml(camp.title || "Campaign")}</div>
              <div class="text-xs text-secondary">${escapeHtml(comp.company_name || "")} · Reward: ${formatCurrency(camp.payment_per_creator, camp.currency || "ETB")}</div>
            </div>
          </div>
          <span class="chip chip-accent">${escapeHtml(app.status)}</span>
        </div>

        ${app.status === "Under Review" ? `
          <div class="card-elevated">
            <p class="text-sm font-medium">Your application is being reviewed by the company.</p>
            <p class="text-xs text-secondary" style="margin-top:4px;">Submitted on ${formatDate(app.created_at)}.</p>
          </div>
        ` : ""}

        ${app.status === "Accepted" ? `
          <div class="card-elevated" style="border-color:var(--status-success);margin-bottom:16px;">
            <strong class="text-success">Congratulations! Your application has been accepted.</strong>
            <p class="text-sm text-secondary" style="margin-top:4px;">Review the brand instructions below and submit your promotional video.</p>
          </div>

          ${agreement ? `
            <div class="card-elevated" style="margin-bottom:16px;">
              <h4 style="margin-bottom:8px;">Collaboration Agreement & Instructions</h4>
              <p class="text-xs text-secondary" style="margin-bottom:6px;"><strong>Instructions:</strong> ${escapeHtml(agreement.instructions)}</p>
              <p class="text-xs text-secondary" style="margin-bottom:6px;"><strong>Video Requirements:</strong> ${escapeHtml(agreement.video_requirements)}</p>
              <p class="text-xs text-secondary" style="margin-bottom:6px;"><strong>Key Messages:</strong> ${escapeHtml(agreement.key_messages)}</p>
              <p class="text-xs text-accent"><strong>Submission Deadline:</strong> ${formatDate(agreement.submission_deadline)}</p>
            </div>
          ` : ""}

          <form id="submit-video-form" data-app-id="${app.id}">
            <h3 style="margin-bottom:10px;">Submit Your Promotional Video</h3>
            <div class="form-group">
              <label class="form-label">TikTok Video URL *</label>
              <input type="url" name="tiktok_video_url" class="form-input" required placeholder="https://www.tiktok.com/@username/video/...">
            </div>
            <div class="form-group">
              <label class="form-label">Video Description (Optional)</label>
              <input type="text" name="description" class="form-input" placeholder="Caption or context for the brand">
            </div>
            <div class="form-group">
              <label class="form-label">Submission Notes (Optional)</label>
              <textarea name="notes" class="form-textarea" placeholder="Any notes for the reviewing team..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Submit Video</button>
          </form>
        ` : ""}
      </div>

      ${submission ? `
        <div class="card" style="margin-bottom:16px;">
          <h3 style="margin-bottom:10px;">Campaign Progress & Tracked Metrics</h3>
          <div class="text-xs text-secondary" style="margin-bottom:12px;">
            Submitted Video: <a href="${escapeHtml(submission.tiktok_video_url)}" target="_blank" rel="noopener" class="text-accent">${escapeHtml(submission.tiktok_video_url)}</a>
          </div>

          ${metrics ? `
            <div style="margin-bottom:14px;">
              <div style="display:flex;justify-content:space-between;font-size:0.83rem;margin-bottom:4px;">
                <span>Views Progress</span>
                <strong>${formatNumber(curViews)} / ${reqViews ? formatNumber(reqViews) : "No minimum"}</strong>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${viewsPct}%;"></div></div>
            </div>

            <div style="margin-bottom:14px;">
              <div style="display:flex;justify-content:space-between;font-size:0.83rem;margin-bottom:4px;">
                <span>Likes Progress</span>
                <strong>${formatNumber(curLikes)} / ${reqLikes ? formatNumber(reqLikes) : "No minimum"}</strong>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${likesPct}%;"></div></div>
            </div>

            <p class="text-xs text-muted" style="margin-bottom:10px;">Last tracked: ${formatDate(metrics.tracked_at)}</p>

            <div class="card-elevated">
              <p class="text-sm font-medium">
                ${thresholdsMet
                  ? "Your campaign requirements have been reached. Waiting for company approval."
                  : "Keep going! Your video is being tracked. The campaign requirements have not been reached yet."}
              </p>

          ` : `
            <div class="card-elevated">
              <p class="text-sm text-secondary">Latest tracked metrics are currently unavailable or awaiting initial sync.</p>

          <h3 style="margin-bottom:12px;">Payment & Withdrawal Progression</h3>
          ${renderPaymentTimeline(payment)}
        </div>
      ` : ""}
    </div>
  `;
}

function renderPaymentTimeline(payment) {
  const currentStatus = payment?.status || "Awaiting Company Approval";
  const currentIdx = PAYMENT_SEQUENCE.indexOf(currentStatus);

  return `
    <div class="timeline-list" style="margin-bottom:16px;">
      ${PAYMENT_SEQUENCE.map((step, idx) => {
        const cls = idx < currentIdx ? "done" : idx === currentIdx ? "current" : "";
        return `
          <div class="timeline-step ${cls}">
            <div class="timeline-dot"></div>
            <div class="text-sm ${idx <= currentIdx ? "font-semibold" : "text-muted"}">${step}</div>
          </div>
        `;
      }).join("")}
    </div>

    ${currentStatus === "Awaiting Payment Information" ? `
      <form id="creator-withdrawal-form" data-payment-id="${payment.id}" class="card-elevated">
        <h4 style="margin-bottom:6px;">Provide Payout Destination</h4>
        <p class="text-xs text-secondary" style="margin-bottom:12px;">Your payment details are encrypted and never displayed publicly.</p>
        <div class="form-group">
          <label class="form-label">Payment Provider / Bank *</label>
          <select name="provider_name" class="form-select" required>
            <option value="Telebirr">Telebirr</option>
            <option value="Commercial Bank of Ethiopia (CBE)">Commercial Bank of Ethiopia (CBE)</option>
            <option value="Awash Bank">Awash Bank</option>
            <option value="Bank of Abyssinia">Bank of Abyssinia</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Account Holder Full Name *</label>
          <input type="text" name="account_holder" class="form-input" required placeholder="Full legal name">
        </div>
        <div class="form-group">
          <label class="form-label">Phone / Account Number *</label>
          <input type="text" name="account_identifier" class="form-input" required placeholder="09... or account number">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Confirm Withdrawal Request (${formatCurrency(payment.amount, payment.currency)})</button>
      </form>
    ` : ""}
  `;
}

// 16. CHALLENGE DETAIL PAGE
function renderChallengeDetailPage(challengeId) {
  const ch = state.challenges.find(c => c.id === challengeId);

  const comp = ch.company_profiles || {};

  return `

            <img src="${escapeHtml(comp.logo_url || DEFAULT_LOGO)}" alt="" class="avatar-xs">
            <span class="text-xs font-semibold">${escapeHtml(comp.company_name || "")}</span>
            ${verifiedBadgeHtml(comp.is_verified)}
          </div>
          <h1 style="margin-bottom:10px;">${escapeHtml(ch.title)}</h1>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
            <span class="chip ${isFull ? "chip-error" : "chip-accent"}">${isFull ? "Challenge full" : `${participants.length}/${ch.max_contestants || "∞"} Contestants`}</span>
            <span class="chip">Min Followers: ${formatNumber(ch.min_followers || 0)}</span>
            <span class="chip">Ends ${formatDate(ch.challenge_ending_date)}</span>
          </div>

          <p class="text-sm text-secondary" style="margin-bottom:16px;">${escapeHtml(ch.description)}</p>

          <h4 style="margin-bottom:8px;">Prize Distribution</h4>
          <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px;">
            ${prizes.map(p => `
              <div class="card-elevated" style="display:flex;justify-content:space-between;padding:10px 14px;">
                <span class="font-semibold">Position #${p.position}</span>
                <span class="font-bold text-accent">${formatCurrency(p.prize_amount, ch.currency || "ETB")}</span>
              </div>
            `).join("")}
          </div>

          ${isCreator ? (
            joined ? `<button class="btn btn-secondary btn-full" disabled>Registered in Challenge</button>`
            : isFull ? `<button class="btn btn-danger btn-full" disabled>Challenge full</button>`
            : `<button class="btn btn-primary btn-full btn-lg" id="join-challenge-btn" data-challenge-id="${ch.id}">Join Challenge</button>`
          ) : ""}
        </div>
      </div>
    </div>
  `;
}

function renderCompanyOfferDetailPage(offerId) {
  const offer = state.companyOffers.find(o => o.id === offerId);
  if (!offer) return `<div class="page-container"><div class="card">Offer not found.</div></div>`;

  const apps = [...(offer.applications || [])].sort((a, b) => {
    const ca = a.creator_profiles || {};
    const cb = b.creator_profiles || {};
    if (state.applicantSort === "completed") return Number(cb.completed_promotions || 0) - Number(ca.completed_promotions || 0);
    if (state.applicantSort === "verified") return Number(Boolean(cb.is_verified)) - Number(Boolean(ca.is_verified));
    if (state.applicantSort === "recent") return new Date(b.created_at) - new Date(a.created_at);
    return Number(cb.follower_count || 0) - Number(ca.follower_count || 0);
  });

  return `
    <div class="page-container">
      <button class="btn btn-secondary btn-sm" data-nav="/company/activity" style="margin-bottom:14px;">← Back to Offers</button>
      <div class="card" style="margin-bottom:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <h2>${escapeHtml(offer.title)}</h2>
            <p class="text-xs text-secondary">Reward: ${formatCurrency(offer.payment_per_creator, offer.currency || "ETB")} · Deadline: ${formatDate(offer.application_deadline)}</p>
          </div>
          <select id="applicant-sort-select" class="form-select" style="width:auto;">
            <option value="followers" ${state.applicantSort === "followers" ? "selected" : ""}>Sort: Highest Followers</option>
            <option value="completed" ${state.applicantSort === "completed" ? "selected" : ""}>Sort: Most Completed</option>
            <option value="verified" ${state.applicantSort === "verified" ? "selected" : ""}>Sort: Verified Creators</option>
            <option value="recent" ${state.applicantSort === "recent" ? "selected" : ""}>Sort: Recently Applied</option>
          </select>
        </div>
      </div>

      <h3 style="margin-bottom:12px;">Applicants & Active Collaborations (${apps.length})</h3>
      <div style="display:flex;flex-direction:column;gap:12px;">
        ${apps.length ? apps.map(app => {
          const cr = app.creator_profiles || {};
          const sub = app.video_submissions?.[0] || null;
          const metrics = sub?.campaign_metrics?.[0] || null;
          return `
            <div class="card">
              <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;">
                <div style="display:flex;align-items:center;gap:12px;cursor:pointer;" data-nav="/creator/${encodeURIComponent(cr.username || "")}">
                  <img src="${escapeHtml(cr.avatar_url || DEFAULT_AVATAR)}" alt="" class="avatar-sm">
                  <div>
                    <div style="display:flex;align-items:center;gap:4px;">
                      <span class="font-bold">@${escapeHtml(cr.username || "creator")}</span>
                      ${verifiedBadgeHtml(cr.is_verified)}
                    </div>
                    <div class="text-xs text-secondary">${formatNumber(cr.follower_count)} followers · ${Number(cr.completed_promotions || 0)} completed</div>
                  </div>
                </div>
                <span class="chip chip-accent">${escapeHtml(app.status)}</span>
              </div>

              <p class="text-xs text-secondary" style="margin-bottom:6px;"><strong>Pitch:</strong> ${escapeHtml(app.message)}</p>
              <p class="text-xs text-secondary" style="margin-bottom:12px;"><strong>Creative Idea:</strong> ${escapeHtml(app.creative_idea)}</p>

              ${sub ? `
                <div class="card-elevated" style="margin-bottom:12px;">
                  <div class="text-xs font-semibold" style="margin-bottom:4px;">Submitted Video (${escapeHtml(sub.review_status)})</div>
                  <a href="${escapeHtml(sub.tiktok_video_url)}" target="_blank" rel="noopener" class="text-xs text-accent">${escapeHtml(sub.tiktok_video_url)}</a>
                  ${metrics ? `<div class="text-xs text-secondary" style="margin-top:6px;">Views: <strong>${formatNumber(metrics.views_count)}</strong> · Likes: <strong>${formatNumber(metrics.likes_count)}</strong></div>` : ""}
                  ${sub.review_status !== "Company Approved" ? `
                    <div style="margin-top:10px;">
                      <button class="btn btn-primary btn-sm" data-approve-video="${app.id}">Approve Video</button>
                    </div>
                  ` : `<div class="text-xs text-success" style="margin-top:6px;">Approved by company — queued for administrator verification.</div>`}
                </div>
              ` : ""}

              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-secondary btn-sm" data-nav="/creator/${encodeURIComponent(cr.username || "")}">View Profile</button>
                ${app.status === "Under Review" ? `
                  <button class="btn btn-primary btn-sm" data-open-accept-modal="${app.id}">Accept & Send Instructions</button>
                  <button class="btn btn-danger btn-sm" data-reject-app="${app.id}">Reject</button>
                ` : ""}
              </div>
            </div>
          `;
        }).join("") : `<div class="card text-sm text-secondary">No applications received for this offer yet.</div>`}
      </div>
    </div>
  `;
}
