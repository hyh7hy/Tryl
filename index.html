/* ==========================================================================
   MASTER VIEW ROUTER
   ========================================================================== */
function renderApp() {
  const root = document.getElementById("app-root");
  if (!root) return;

  if (!state.authReady) {
    root.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;"><span class="text-sm text-secondary">Initializing HAWME...</span></div>`;
    return;
  }

  const path = state.route;
  const role = state.profile?.account_type;
  let content = "";

  // Enforce onboarding completion for authenticated users
  if (state.firebaseUser && state.profile && !state.profile.onboarding_completed && path !== "/onboarding") {
    state.route = "/onboarding";
    content = renderOnboardingPage();
    root.innerHTML = renderShell(content) + renderActiveModal();
    bindEvents();
    return;
  }

  let params;
  if (path === "/" || path === "") {
    if (role === "creator") content = renderCreatorHomePage();
    else if (role === "company") content = renderCompanyHomePage();
    else content = renderLandingPage();
  } else if (path === "/register") {
    content = renderRegisterPage();
  } else if (path === "/login") {
    content = renderLoginPage();
  } else if (path === "/onboarding") {
    content = renderOnboardingPage();
  } else if (path === "/explore" || path === "/creator/explore" || path === "/company/explore") {
    content = renderExplorePage();
  } else if (path === "/creator/leaderboard" || path === "/company/leaderboard") {
    content = renderLeaderboardPage();
  } else if (path === "/creator/home") {
    content = role === "creator" ? renderCreatorHomePage() : renderLandingPage();
  } else if (path === "/creator/activity") {
    content = role === "creator" ? renderCreatorActivityPage() : renderLandingPage();
  } else if (path === "/creator/profile") {
    content = role === "creator" ? renderCreatorProfilePage() : renderLandingPage();
  } else if (path === "/creator/edit-profile") {
    content = role === "creator" ? renderEditProfilePage() : renderLandingPage();
  } else if (path === "/creator/verification") {
    content = role === "creator" ? renderVerificationPage(state._latestVerifyReq) : renderLandingPage();
  } else if (path === "/creator/payments") {
    content = role === "creator" ? renderCreatorPaymentsPage() : renderLandingPage();
  } else if ((params = matchRoute("/creator/applications/:id", path)) || (params = matchRoute("/creator/collaborations/:id", path))) {
    content = role === "creator" ? renderCreatorApplicationDetailPage(params.id) : renderLandingPage();
  } else if (path === "/company/home") {
    content = role === "company" ? renderCompanyHomePage() : renderLandingPage();
  } else if (path === "/company/create" || path === "/company/create/promotion") {
    content = role === "company" ? renderCreatePromotionPage() : renderLandingPage();
  } else if (path === "/company/create/challenge") {
    content = role === "company" ? renderCreateChallengePage() : renderLandingPage();
  } else if (path === "/company/activity") {
    content = role === "company" ? renderCompanyActivityPage() : renderLandingPage();
  } else if (path === "/company/profile") {
    content = role === "company" ? renderCompanyProfilePage() : renderLandingPage();
  } else if (path === "/company/edit-profile") {
    content = role === "company" ? renderEditProfilePage() : renderLandingPage();
  } else if (path === "/company/verification") {
    content = role === "company" ? renderVerificationPage() : renderLandingPage();
  } else if ((params = matchRoute("/company/offers/:id", path))) {
    content = role === "company" ? renderCompanyOfferDetailPage(params.id) : renderLandingPage();
  } else if ((params = matchRoute("/campaign/:id", path))) {
    content = renderCampaignDetailPage(params.id);
  } else if ((params = matchRoute("/challenge/:id", path))) {
    content = renderChallengeDetailPage(params.id);
  } else if ((params = matchRoute("/creator/:username", path))) {
    content = renderCreatorProfilePage(params.username);
  } else if ((params = matchRoute("/company/:username", path))) {
    content = renderCompanyProfilePage(params.username);
  } else {
    content = renderLandingPage();
  }

  root.innerHTML = renderShell(content) + renderActiveModal();
  if (window.lucide) window.lucide.createIcons();
  bindEvents();
}

/* ==========================================================================
   24. EVENT HANDLERS
   ========================================================================== */
function bindEvents() {
  // Navigation links
  document.querySelectorAll("[data-nav]").forEach(el => {
    el.onclick = e => {
      e.preventDefault();
      state.modal = null;
      navigate(el.getAttribute("data-nav"));
    };
  });

  // Theme toggles
  ["theme-toggle-btn", "theme-toggle-btn-mobile", "modal-theme-switch"].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.onclick = () => {
      state.modal = null;
      setTheme(state.theme === "dark" ? "light" : "dark");
    };
  });

  // Logout buttons
  ["logout-btn", "modal-logout-btn"].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.onclick = () => {
      state.modal = null;
      handleLogout();
    };
  });

  // Role choice
  const cRole = document.getElementById("choose-creator-role");
  if (cRole) cRole.onclick = () => { state.selectedRegRole = "creator"; renderApp(); };
  const coRole = document.getElementById("choose-company-role");
  if (coRole) coRole.onclick = () => { state.selectedRegRole = "company"; renderApp(); };
  const resetRole = document.getElementById("reset-role-choice");
  if (resetRole) resetRole.onclick = () => { state.selectedRegRole = null; renderApp(); };

  // Email Registration
  const regForm = document.getElementById("register-form");
  if (regForm) {
    regForm.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(regForm);
      try {
        await registerWithEmail(fd.get("email"), fd.get("password"), state.selectedRegRole);
        showToast("Account created! Complete your profile setup.", "success");
        navigate("/onboarding");
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  // Email Login
  const loginForm = document.getElementById("login-form");
  if (loginForm) {
    loginForm.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(loginForm);
      try {
        const prof = await loginWithEmail(fd.get("email"), fd.get("password"));
        if (!prof || !prof.onboarding_completed) navigate("/onboarding");
        else navigate(prof.account_type === "creator" ? "/creator/home" : "/company/home");
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  // Forgot Password
  const forgotBtn = document.getElementById("forgot-password-btn");
  if (forgotBtn) {
    forgotBtn.onclick = async () => {
      const emailInput = document.querySelector('#login-form input[name="email"]');
      const email = emailInput?.value?.trim();
      if (!email) return showToast("Enter your email address first.", "error");
      try {
        await sendPasswordResetEmail(auth, email);
        showToast("Password reset email sent.", "success");
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  // Google Auth
  const googleBtn = document.getElementById("google-auth-btn");
  if (googleBtn) {
    googleBtn.onclick = async () => {
      try {
        const prof = await authenticateWithGoogle(state.selectedRegRole);
        if (!prof) return;
        if (!prof.onboarding_completed) navigate("/onboarding");
        else navigate(prof.account_type === "creator" ? "/creator/home" : "/company/home");
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  // File Uploads (Avatar, Logo, Covers)
  const bindImageUpload = (fileInputId, hiddenInputId, previewId, folder) => {
    const fileInput = document.getElementById(fileInputId);
    if (!fileInput) return;
    fileInput.onchange = async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      try {
        showToast("Uploading image...");
        const url = await uploadMediaFile(file, folder);
        const hidden = document.getElementById(hiddenInputId);
        const prev = document.getElementById(previewId);
        if (hidden) hidden.value = url;
        if (prev) prev.src = url;
        showToast("Image uploaded successfully.", "success");
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  };
  bindImageUpload("onboard-avatar-file", "onboard-avatar-url", "onboard-avatar-preview", "avatars");
  bindImageUpload("edit-avatar-file", "edit-avatar-url", "edit-avatar-preview", "avatars");
  bindImageUpload("onboard-logo-file", "onboard-logo-url", "onboard-logo-preview", "logos");
  bindImageUpload("edit-logo-file", "edit-logo-url", "edit-logo-preview", "logos");
  bindImageUpload("promo-cover-file", "promo-cover-url", null, "covers");
  bindImageUpload("challenge-cover-file", "challenge-cover-url", null, "covers");

  // Creator Onboarding & Edit Profile
  ["creator-onboarding-form", "edit-creator-profile-form"].forEach(formId => {
    const form = document.getElementById(formId);
    if (!form) return;
    form.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const cats = fd.getAll("categories");
      if (!cats.length) return showToast("Select at least one content category.", "error");
      try {
        await saveCreatorProfile({
          full_name: fd.get("full_name"),
          username: fd.get("username"),
          avatar_url: fd.get("avatar_url"),
          bio: fd.get("bio"),
          country: fd.get("country"),
          city: fd.get("city"),
          tiktok_username: fd.get("tiktok_username"),
          tiktok_url: fd.get("tiktok_url"),
          instagram_username: fd.get("instagram_username"),
          youtube_username: fd.get("youtube_username"),
          follower_count: fd.get("follower_count"),
          advertised_rate: fd.get("advertised_rate"),
          languages: String(fd.get("languages") || "").split(",").map(s => s.trim()).filter(Boolean),
          categories: cats
        });
        showToast("Creator profile saved!", "success");
        navigate(formId === "creator-onboarding-form" ? "/creator/home" : "/creator/profile");
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  });

  // Company Onboarding & Edit Profile
  ["company-onboarding-form", "edit-company-profile-form"].forEach(formId => {
    const form = document.getElementById(formId);
    if (!form) return;
    form.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(form);
      try {
        await saveCompanyProfile({
          company_name: fd.get("company_name"),
          username: fd.get("username"),
          logo_url: fd.get("logo_url"),
          description: fd.get("description"),
          industry: fd.get("industry"),
          country: fd.get("country"),
          city: fd.get("city"),
          website: fd.get("website"),
          business_email: fd.get("business_email"),
          contact_details: fd.get("contact_details")
        });
        showToast("Company profile saved!", "success");
        navigate(formId === "company-onboarding-form" ? "/company/home" : "/company/profile");
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  });

  // Explore search, category & tabs
  const searchIn = document.getElementById("explore-search-input");
  if (searchIn) {
    searchIn.oninput = () => {
      state.exploreSearch = searchIn.value;
      renderApp();
      const ref = document.getElementById("explore-search-input");
      if (ref) { ref.focus(); ref.setSelectionRange(ref.value.length, ref.value.length); }
    };
  }
  document.querySelectorAll("[data-explore-cat]").forEach(btn => {
    btn.onclick = () => { state.exploreCategory = btn.getAttribute("data-explore-cat"); renderApp(); };
  });
  document.querySelectorAll("[data-explore-tab]").forEach(btn => {
    btn.onclick = () => { state.exploreTab = btn.getAttribute("data-explore-tab"); renderApp(); };
  });

  // Community post like & comment
  document.querySelectorAll("[data-like-post]").forEach(btn => {
    btn.onclick = async () => {
      if (!state.profile) return navigate("/login");
      const postId = btn.getAttribute("data-like-post");
      const post = state.communityPosts.find(p => p.id === postId);
      const existing = post?.social_post_likes?.find(l => l.profile_id === state.profile.id);
      if (existing) {
        await supabase.from("social_post_likes").delete().match({ post_id: postId, profile_id: state.profile.id });
      } else {
        await supabase.from("social_post_likes").insert({ post_id: postId, profile_id: state.profile.id });
      }
      await fetchMarketplaceData();
      renderApp();
    };
  });

  document.querySelectorAll(".post-comment-form").forEach(form => {
    form.onsubmit = async e => {
      e.preventDefault();
      if (!state.profile) return navigate("/login");
      const postId = form.getAttribute("data-post-id");
      const content = new FormData(form).get("comment").trim();
      if (!content) return;
      await supabase.from("social_post_comments").insert({
        post_id: postId,
        profile_id: state.profile.id,
        content
      });
      await fetchMarketplaceData();
      renderApp();
    };
  });

  // Tabs (Leaderboard, Activity, Profile)
  document.querySelectorAll("[data-lb-tab]").forEach(b => b.onclick = () => { state.leaderboardTab = b.getAttribute("data-lb-tab"); renderApp(); });
  document.querySelectorAll("[data-ca-tab]").forEach(b => b.onclick = () => { state.creatorActivityTab = b.getAttribute("data-ca-tab"); renderApp(); });
  document.querySelectorAll("[data-coa-tab]").forEach(b => b.onclick = () => { state.companyActivityTab = b.getAttribute("data-coa-tab"); renderApp(); });
  document.querySelectorAll("[data-cp-tab]").forEach(b => b.onclick = () => { state.creatorProfileTab = b.getAttribute("data-cp-tab"); renderApp(); });

  // Notification click
  document.querySelectorAll("[data-notif-id]").forEach(card => {
    card.onclick = async () => {
      const id = card.getAttribute("data-notif-id");
      const route = card.getAttribute("data-notif-route");
      await supabase.from("notifications").update({ is_read: true }).eq("id", id);
      if (route) navigate(route);
    };
  });

  // Apply to campaign
  const applyForm = document.getElementById("apply-campaign-form");
  if (applyForm) {
    applyForm.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(applyForm);
      try {
        await applyToCampaign(applyForm.getAttribute("data-campaign-id"), fd.get("message"), fd.get("creative_idea"));
        showToast("Application submitted!", "success");
        await fetchUserActivityData();
        navigate("/creator/activity");
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  // Join challenge
  const joinChBtn = document.getElementById("join-challenge-btn");
  if (joinChBtn) {
    joinChBtn.onclick = async () => {
      try {
        const chId = joinChBtn.getAttribute("data-challenge-id");
        const { error } = await supabase.from("challenge_participants").insert({
          challenge_id: chId,
          creator_profile_id: state.creatorProfile.id
        });
        if (error) throw error;
        showToast("Joined challenge!", "success");
        await fetchMarketplaceData();
        renderApp();
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  // Submit video
  const subVidForm = document.getElementById("submit-video-form");
  if (subVidForm) {
    subVidForm.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(subVidForm);
      try {
        await submitCreatorVideo(subVidForm.getAttribute("data-app-id"), fd.get("tiktok_video_url"), fd.get("description"), fd.get("notes"));
        showToast("Video submitted and tracking started!", "success");
        await fetchUserActivityData();
        renderApp();
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  // Creator withdrawal request
  const wForm = document.getElementById("creator-withdrawal-form");
  if (wForm) {
    wForm.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(wForm);
      try {
        await submitCreatorWithdrawalRequest(
          wForm.getAttribute("data-payment-id"),
          fd.get("provider_name"),
          fd.get("account_holder"),
          fd.get("account_identifier")
        );
        showToast("Withdrawal request submitted!", "success");
        await fetchUserActivityData();
        renderApp();
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  // Creator verification
  const genCodeForm = document.getElementById("generate-verify-code-form");
  if (genCodeForm) {
    genCodeForm.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(genCodeForm);
      try {
        state._latestVerifyReq = await generateCreatorVerificationRequest(fd.get("tiktok_username"));
        showToast("Verification code generated.", "success");
        renderApp();
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  const confirmBioBtn = document.getElementById("confirm-bio-code-btn");
  if (confirmBioBtn) {
    confirmBioBtn.onclick = async () => {
      try {
        const reqId = confirmBioBtn.getAttribute("data-req-id");
        await confirmVerificationCodePlaced(reqId);
        state._latestVerifyReq.status = "Under Review";
        showToast("Submitted for administrator review.", "success");
        renderApp();
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  // Company create promotion
  const createPromoForm = document.getElementById("create-promotion-form");
  if (createPromoForm) {
    createPromoForm.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(createPromoForm);
      try {
        const payMethod = fd.get("payment_method");
        const initialStatus = payMethod === "prepaid_escrow" ? "awaiting_prepayment_verification" : "published";
        const perCreator = Number(fd.get("payment_per_creator"));
        const count = Number(fd.get("creators_needed"));

        const { data: camp, error } = await supabase.from("campaigns").insert({
          company_profile_id: state.companyProfile.id,
          title: fd.get("title"),
          cover_image_url: fd.get("cover_image_url"),
          product_name: fd.get("product_name"),
          category: fd.get("category"),
          description: fd.get("description"),
          payment_per_creator: perCreator,
          total_budget: perCreator * count,
          creators_needed: count,
          currency: "ETB",
          payment_method: payMethod,
          application_deadline: fd.get("application_deadline"),
          submission_deadline: fd.get("submission_deadline"),
          status: initialStatus
        }).select().single();
        if (error) throw error;

        await supabase.from("campaign_requirements").insert({
          campaign_id: camp.id,
          min_followers: Number(fd.get("min_followers") || 0),
          min_views: fd.get("min_views") ? Number(fd.get("min_views")) : null,
          min_likes: fd.get("min_likes") ? Number(fd.get("min_likes")) : null,
          video_requirements: fd.get("video_requirements")
        });

        showToast(
          initialStatus === "published"
            ? "Promotion published to marketplace!"
            : "Promotion saved. Awaiting administrator verification of prepaid funds.",
          "success"
        );
        await fetchMarketplaceData();
        await fetchUserActivityData();
        navigate("/company/activity");
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  // Company create challenge
  const createChalForm = document.getElementById("create-challenge-form");
  if (createChalForm) {
    createChalForm.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(createChalForm);
      try {
        const prizes = String(fd.get("prize_list") || "")
          .split(",")
          .map(s => Number(s.trim()))
          .filter(n => n > 0);
        if (!prizes.length) throw new Error("Enter at least one valid prize amount.");

        const { data: ch, error } = await supabase.from("challenges").insert({
          company_profile_id: state.companyProfile.id,
          title: fd.get("title"),
          cover_image_url: fd.get("cover_image_url"),
          description: fd.get("description"),
          min_followers: Number(fd.get("min_followers") || 0),
          max_contestants: Number(fd.get("max_contestants") || 25),
          application_closing_date: fd.get("application_closing_date"),
          challenge_ending_date: fd.get("challenge_ending_date"),
          currency: "ETB",
          status: "published"
        }).select().single();
        if (error) throw error;

        await supabase.from("challenge_prizes").insert(
          prizes.map((amt, i) => ({ challenge_id: ch.id, position: i + 1, prize_amount: amt }))
        );

        showToast("Challenge published!", "success");
        await fetchMarketplaceData();
        navigate("/company/explore");
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  // Company applicant sorting & actions
  const sortSel = document.getElementById("applicant-sort-select");
  if (sortSel) sortSel.onchange = () => { state.applicantSort = sortSel.value; renderApp(); };

  document.querySelectorAll("[data-open-accept-modal]").forEach(btn => {
    btn.onclick = () => {
      state.modal = { type: "accept-applicant", applicationId: btn.getAttribute("data-open-accept-modal") };
      renderApp();
    };
  });

  const acceptForm = document.getElementById("accept-agreement-form");
  if (acceptForm) {
    acceptForm.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(acceptForm);
      try {
        await acceptApplicantWithAgreement(acceptForm.getAttribute("data-app-id"), {
          instructions: fd.get("instructions"),
          video_requirements: fd.get("video_requirements"),
          product_info: fd.get("product_info"),
          key_messages: fd.get("key_messages"),
          creative_direction: fd.get("creative_direction"),
          submission_deadline: fd.get("submission_deadline")
        });
        state.modal = null;
        showToast("Collaboration agreement sent to creator!", "success");
        await fetchUserActivityData();
        renderApp();
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  }

  document.querySelectorAll("[data-reject-app]").forEach(btn => {
    btn.onclick = async () => {
      await supabase.from("applications").update({ status: "Rejected" }).eq("id", btn.getAttribute("data-reject-app"));
      showToast("Application rejected.");
      await fetchUserActivityData();
      renderApp();
    };
  });

  document.querySelectorAll("[data-approve-video]").forEach(btn => {
    btn.onclick = async () => {
      try {
        await approveVideoByCompany(btn.getAttribute("data-approve-video"));
        showToast("Video approved! Queued for administrator verification.", "success");
        await fetchUserActivityData();
        renderApp();
      } catch (err) {
        showToast(err.message, "error");
      }
    };
  });

  // Modals & Bottom Sheets
  const openCreatorMenu = document.getElementById("open-creator-menu-btn");
  if (openCreatorMenu) openCreatorMenu.onclick = () => { state.modal = { type: "creator-menu" }; renderApp(); };
  const openCompanyMenu = document.getElementById("open-company-menu-btn");
  if (openCompanyMenu) openCompanyMenu.onclick = () => { state.modal = { type: "company-menu" }; renderApp(); };
  const openCreateSheet = document.getElementById("open-company-create-sheet");
  if (openCreateSheet) openCreateSheet.onclick = () => { state.modal = { type: "company-create-sheet" }; renderApp(); };

  const backdrop = document.getElementById("modal-backdrop");
  if (backdrop) {
    backdrop.onclick = e => {
      if (e.target === backdrop) { state.modal = null; renderApp(); }
    };
  }
  const closeModal = document.getElementById("close-modal-btn");
  if (closeModal) closeModal.onclick = () => { state.modal = null; renderApp(); };
}

/* ==========================================================================
   25. INITIALIZATION & SESSION RESTORATION
   ========================================================================== */
onAuthStateChanged(auth, async fbUser => {
  state.firebaseUser = fbUser;
  await loadCurrentUserAccount(fbUser);
  await onRouteEnter(state.route);
  state.authReady = true;
  renderApp();
});
</script>
