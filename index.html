<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HAWME Admin — Full Platform Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        hawme: {
                            cyan: '#25F4EE',
                            coral: '#FE2C55',
                            sage: '#588B6C',
                            sageDeep: '#315C42',
                            darkBg: '#080808',
                            darkSec: '#101113',
                            darkCard: '#151619',
                            darkElev: '#1C1E22',
                            darkBorder: '#26272B',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #080808;
            --bg-sec: #101113;
            --bg-card: #151619;
            --bg-elev: #1C1E22;
            --text-primary: #F4F4F5;
            --text-secondary: #A1A1AA;
            --text-muted: #71717A;
            --accent-primary: #25F4EE;
            --accent-secondary: #FE2C55;
            --border-normal: #26272B;
            --border-focus: #25F4EE;
            --btn-cta-bg: linear-gradient(90deg, #FE2C55 0%, #25F4EE 100%);
            --btn-cta-text: #080808;
            --nav-backdrop: rgba(8, 8, 8, 0.92);
            --atmosphere:
                radial-gradient(ellipse 85% 420px at 50% -40px, rgba(37, 244, 238, 0.11), rgba(254, 44, 85, 0.06) 45%, transparent 78%),
                radial-gradient(circle at 12% 38%, rgba(254, 44, 85, 0.05), transparent 42%),
                linear-gradient(180deg, #080808 0%, #0D0E10 52%, #111215 100%);
        }

        html:not(.dark) {
            --bg-main: #F4F8F3;
            --bg-sec: #ECF3EB;
            --bg-card: #FFFFFF;
            --bg-elev: #F1F6F0;
            --text-primary: #17221B;
            --text-secondary: #4B5B51;
            --text-muted: #738278;
            --accent-primary: #588B6C;
            --accent-secondary: #315C42;
            --border-normal: #DCE6DC;
            --border-focus: #588B6C;
            --btn-cta-bg: linear-gradient(90deg, #315C42 0%, #588B6C 100%);
            --btn-cta-text: #FFFFFF;
            --nav-backdrop: rgba(244, 248, 243, 0.92);
            --atmosphere:
                radial-gradient(ellipse 90% 420px at 50% -50px, rgba(118, 168, 137, 0.24), rgba(220, 237, 224, 0.14) 55%, transparent 80%),
                linear-gradient(180deg, #F7FAF6 0%, #EFF5EE 55%, #E8F1E7 100%);
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            transition: background-color 200ms ease, color 200ms ease;
        }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .atmosphere-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image: var(--atmosphere);
        }
        .card-outer {
            background-color: var(--bg-card);
            border: 1px solid var(--border-normal);
            border-radius: 24px;
        }
        .card-inner {
            background-color: var(--bg-elev);
            border: 1px solid var(--border-normal);
            border-radius: 12px;
        }
        .input-field {
            width: 100%;
            background-color: var(--bg-elev);
            border: 1px solid var(--border-normal);
            border-radius: 12px;
            color: var(--text-primary);
        }
        .input-field:focus {
            outline: none;
            border-color: var(--border-focus);
        }
        .btn-cta {
            background: var(--btn-cta-bg);
            color: var(--btn-cta-text);
            border-radius: 12px;
            font-weight: 800;
            transition: opacity 150ms ease;
        }
        .btn-cta:hover:not(:disabled) { opacity: 0.93; }
        .btn-cta:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border-normal);
            color: var(--text-primary);
            border-radius: 12px;
            font-weight: 700;
        }
        .btn-ghost:hover { border-color: var(--accent-primary); }
        .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #F87171;
            border-radius: 12px;
            font-weight: 700;
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.22); }
        .text-accent { color: var(--accent-primary); }
        .text-sec { color: var(--text-secondary); }
        .text-mut { color: var(--text-muted); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(130, 130, 130, 0.25); border-radius: 99px; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <div class="atmosphere-glow"></div>
    <div id="toast-container" class="fixed top-4 right-4 left-4 sm:left-auto z-[70] flex flex-col space-y-2.5 pointer-events-none"></div>

    <!-- Confirmation Modal for Deletions -->
    <div id="confirm-modal" onclick="if(event.target===this) closeConfirmModal()" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="card-outer p-6 max-w-sm w-full shadow-2xl space-y-4">
            <h3 id="confirm-title" class="font-black text-lg">Confirm Action</h3>
            <p id="confirm-desc" class="text-xs text-sec leading-relaxed"></p>
            <div class="flex gap-3 pt-1">
                <button id="confirm-exec-btn" class="flex-1 py-3 btn-danger text-xs font-extrabold">Delete Permanently</button>
                <button onclick="closeConfirmModal()" class="flex-1 py-3 btn-ghost text-xs">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Edit User Stats / Followers / Verification Modal -->
    <div id="edit-user-modal" onclick="if(event.target===this) closeEditUserModal()" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
        <div class="card-outer p-6 max-w-md w-full shadow-2xl space-y-4 my-8">
            <div class="flex items-center justify-between pb-2 border-b" style="border-color: var(--border-normal);">
                <h3 class="font-black text-lg">Edit Member Record</h3>
                <button onclick="closeEditUserModal()" class="text-sec hover:opacity-100"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="saveAdminUserEdit(event)" class="space-y-4">
                <input type="hidden" id="admin-edit-uid">
                <div>
                    <label class="block text-xs font-bold text-sec mb-1">Display / Company Name</label>
                    <input type="text" id="admin-edit-name" required class="input-field px-3.5 py-2.5 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-sec mb-1">HAWME Username</label>
                        <input type="text" id="admin-edit-hawme" required class="input-field px-3.5 py-2.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-sec mb-1">TikTok Username</label>
                        <input type="text" id="admin-edit-tiktok" class="input-field px-3.5 py-2.5 text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-sec mb-1">Verified Followers</label>
                        <input type="number" id="admin-edit-followers" min="0" class="input-field px-3.5 py-2.5 text-sm tabular-nums">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-sec mb-1">Completed Promos</label>
                        <input type="number" id="admin-edit-completed" min="0" class="input-field px-3.5 py-2.5 text-sm tabular-nums">
                    </div>
                </div>
                <div class="flex items-center justify-between p-3.5 card-inner">
                    <span class="text-xs font-bold">Verified Badge Status</span>
                    <input type="checkbox" id="admin-edit-verified" class="w-4 h-4 accent-cyan-400">
                </div>
                <div class="flex gap-3 pt-1">
                    <button type="submit" class="flex-1 py-3 btn-cta text-xs">Save Changes</button>
                    <button type="button" onclick="closeEditUserModal()" class="px-5 py-3 btn-ghost text-xs">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Top Admin Header -->
    <header class="sticky top-0 z-40 backdrop-blur-md border-b" style="background: var(--nav-backdrop); border-color: var(--border-normal);">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[#FE2C55] to-[#25F4EE] flex items-center justify-center p-[2px]">
                    <div class="w-full h-full rounded-[10px] flex items-center justify-center" style="background: var(--bg-main);">
                        <span class="font-black text-accent text-lg">H</span>
                    </div>
                </div>
                <div>
                    <span class="font-extrabold text-base tracking-tight">HAWME Admin</span>
                    <span id="admin-session-badge" class="hidden sm:inline-block ml-2 text-xs text-accent font-bold">Authenticated</span>
                </div>
            </div>

            <div class="flex items-center space-x-2.5">
                <button onclick="refreshAllAdminData()" id="refresh-btn" class="hidden p-2 rounded-xl btn-ghost" title="Refresh Database">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
                <button onclick="toggleThemeMode()" class="p-2 rounded-xl btn-ghost" title="Switch Theme">
                    <i id="theme-toggle-icon" data-lucide="sun" class="w-4 h-4 text-accent"></i>
                </button>
                <button id="admin-logout-btn" onclick="adminLogout()" class="hidden px-3.5 py-2 btn-danger text-xs">
                    Lock / Log Out
                </button>
            </div>
        </div>
    </header>

    <main id="admin-app" class="flex-grow relative z-10"></main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
        getFirestore,
        doc,
        getDoc,
        collection,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCayGcfnpCAGNDph3YTyEA9_KDdD2C5Fg0",
        authDomain: "my-tiktok-cbd6f.firebaseapp.com",
        databaseURL: "https://my-tiktok-cbd6f-default-rtdb.firebaseio.com",
        projectId: "my-tiktok-cbd6f",
        storageBucket: "my-tiktok-cbd6f.firebasestorage.app",
        messagingSenderId: "964441294320",
        appId: "1:964441294320:web:4c8da74a0cee8ed2644935",
        measurementId: "G-RYBWW6XB10"
    };

    const SUPABASE_CONFIG = {
        storageUrl: "https://akoddbuemubeorwfwonv.supabase.co/storage/v1",
        publishableKey: "sb_publishable_e433Ao5lccy9spSTVpMqOw_hw25ae_f",
        bucket: "campaign-images"
    };

    // Password-only access key
    const ADMIN_MASTER_PASSWORD = "2026Hawme";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.adminState = {
        unlocked: sessionStorage.getItem("hawme_admin_unlocked") === "true",
        tab: "overview",
        search: "",
        roleFilter: "all",
        offerFilter: "all",
        notifTargetMode: "all_creators",
        users: [],
        campaigns: [],
        applications: [],
        deals: [],
        verifications: [],
        withdrawals: [],
        transactions: [],
        posts: [],
        notifications: []
    };

    window.escapeHTML = function(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    };

    window.showToast = function(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const borderCol = type === 'error' ? 'border-red-500/60 text-red-400' : (type === 'success' ? 'border-accent text-accent' : '');
        toast.className = `card-outer ${borderCol} px-4 py-3 shadow-xl text-xs font-bold flex items-center space-x-2.5 transition-all duration-200 pointer-events-auto`;
        toast.innerHTML = `
            <i data-lucide="${type === 'success' ? 'check-circle' : (type === 'error' ? 'alert-circle' : 'info')}" class="w-4 h-4 shrink-0"></i>
            <span>${window.escapeHTML(message)}</span>
        `;
        container.appendChild(toast);
        lucide.createIcons();
        setTimeout(() => toast.remove(), 3500);
    };

    window.toggleThemeMode = function() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('hawme_theme_mode', isDark ? 'dark' : 'light');
        const icon = document.getElementById('theme-toggle-icon');
        if (icon) icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
        lucide.createIcons();
    };

    window.uploadImageToSupabase = async function(file) {
        const fileExt = file.name.split('.').pop().toLowerCase();
        const cleanFileName = `admin_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
        const uploadPath = `community/${cleanFileName}`;
        const uploadUrl = `${SUPABASE_CONFIG.storageUrl}/object/${SUPABASE_CONFIG.bucket}/${uploadPath}`;

        const response = await fetch(uploadUrl, {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_CONFIG.publishableKey,
                'Authorization': `Bearer ${SUPABASE_CONFIG.publishableKey}`,
                'Content-Type': file.type || 'image/jpeg',
                'x-upsert': 'true'
            },
            body: file
        });
        if (!response.ok) throw new Error(await response.text());
        return `${SUPABASE_CONFIG.storageUrl}/object/public/${SUPABASE_CONFIG.bucket}/${uploadPath}`;
    };

    // Password-Only Login Handler
    window.handlePasswordLogin = async function(e) {
        e.preventDefault();
        const input = document.getElementById('admin-password-input');
        const val = input ? input.value : '';
        if (val === ADMIN_MASTER_PASSWORD) {
            window.adminState.unlocked = true;
            sessionStorage.setItem("hawme_admin_unlocked", "true");
            updateHeaderSessionUI();
            window.showToast('Admin console unlocked', 'success');
            await refreshAllAdminData();
        } else {
            window.showToast('Incorrect admin password', 'error');
            if (input) { input.value = ''; input.focus(); }
        }
    };

    window.adminLogout = function() {
        window.adminState.unlocked = false;
        sessionStorage.removeItem("hawme_admin_unlocked");
        updateHeaderSessionUI();
        renderAdminApp();
        window.showToast('Admin console locked', 'info');
    };

    function updateHeaderSessionUI() {
        const unlocked = window.adminState.unlocked;
        document.getElementById('admin-logout-btn')?.classList.toggle('hidden', !unlocked);
        document.getElementById('refresh-btn')?.classList.toggle('hidden', !unlocked);
        document.getElementById('admin-session-badge')?.classList.toggle('hidden', !unlocked);
    }

    // Confirmation Dialog
    window.openConfirmModal = function(title, description, onConfirm) {
        document.getElementById('confirm-title').innerText = title;
        document.getElementById('confirm-desc').innerText = description;
        const btn = document.getElementById('confirm-exec-btn');
        btn.onclick = async () => {
            btn.disabled = true;
            btn.innerText = 'Processing...';
            try {
                await onConfirm();
                closeConfirmModal();
            } finally {
                btn.disabled = false;
                btn.innerText = 'Delete Permanently';
            }
        };
        document.getElementById('confirm-modal').classList.remove('hidden');
    };

    window.closeConfirmModal = function() {
        document.getElementById('confirm-modal').classList.add('hidden');
    };

    // Load Complete Firestore Database
    window.refreshAllAdminData = async function() {
        const s = window.adminState;
        try {
            const [uSnap, cSnap, aSnap, dSnap, vSnap, wSnap, tSnap, pSnap, nSnap] = await Promise.all([
                getDocs(collection(db, "users")),
                getDocs(collection(db, "campaigns")),
                getDocs(collection(db, "applications")),
                getDocs(collection(db, "direct_deals")),
                getDocs(collection(db, "verification_requests")),
                getDocs(collection(db, "withdrawals")),
                getDocs(collection(db, "transactions")),
                getDocs(collection(db, "community_posts")),
                getDocs(collection(db, "notifications"))
            ]);

            s.users = uSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            s.campaigns = cSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            s.applications = aSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            s.deals = dSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            s.verifications = vSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            s.withdrawals = wSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            s.transactions = tSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            s.posts = pSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            s.notifications = nSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

            renderAdminApp();
        } catch (err) {
            window.showToast('Database sync error: ' + err.message, 'error');
        }
    };

    window.setAdminTab = function(tab) {
        window.adminState.tab = tab;
        renderAdminApp();
    };

    // ==========================================================================
    // DEEP ADMIN CONTROLS: USERS, OFFERS, APPLICATIONS, DEALS, NOTIFICATIONS, PAYOUTS
    // ==========================================================================

    // 1. Delete User Account & All Related Records
    window.promptDeleteUser = function(userId, displayName, role) {
        openConfirmModal(
            `Delete ${displayName}?`,
            `This permanently removes this ${role} account, their posted offers, applications, and direct deals from HAWME.`,
            async () => {
                await deleteDoc(doc(db, "users", userId));
                for (const c of window.adminState.campaigns.filter(x => x.user_id === userId)) {
                    await deleteDoc(doc(db, "campaigns", c.id));
                }
                for (const a of window.adminState.applications.filter(x => x.creator_id === userId || x.company_owner_id === userId)) {
                    await deleteDoc(doc(db, "applications", a.id));
                }
                for (const d of window.adminState.deals.filter(x => x.creator_id === userId || x.company_id === userId)) {
                    await deleteDoc(doc(db, "direct_deals", d.id));
                }
                window.showToast(`User "${displayName}" permanently deleted.`, 'success');
                await refreshAllAdminData();
            }
        );
    };

    // Open Edit User Modal
    window.openEditUserModal = function(userId) {
        const u = window.adminState.users.find(x => x.id === userId);
        if (!u) return;
        document.getElementById('admin-edit-uid').value = u.id;
        document.getElementById('admin-edit-name').value = u.name || '';
        document.getElementById('admin-edit-hawme').value = u.hawme_username || '';
        document.getElementById('admin-edit-tiktok').value = u.tiktok_username || '';
        document.getElementById('admin-edit-followers').value = Number(u.followers || 0);
        document.getElementById('admin-edit-completed').value = Number(u.completed_promotions || 0);
        document.getElementById('admin-edit-verified').checked = Boolean(u.is_verified);
        document.getElementById('edit-user-modal').classList.remove('hidden');
        lucide.createIcons();
    };

    window.closeEditUserModal = function() {
        document.getElementById('edit-user-modal').classList.add('hidden');
    };

    window.saveAdminUserEdit = async function(e) {
        e.preventDefault();
        const uid = document.getElementById('admin-edit-uid').value;
        const cleanHawme = document.getElementById('admin-edit-hawme').value.toLowerCase().replace(/^@+/, '').trim();
        const updates = {
            name: document.getElementById('admin-edit-name').value.trim(),
            hawme_username: cleanHawme,
            tiktok_username: '@' + document.getElementById('admin-edit-tiktok').value.replace(/^@+/, '').trim(),
            followers: Number(document.getElementById('admin-edit-followers').value || 0),
            completed_promotions: Number(document.getElementById('admin-edit-completed').value || 0),
            is_verified: document.getElementById('admin-edit-verified').checked
        };
        try {
            await updateDoc(doc(db, "users", uid), updates);
            closeEditUserModal();
            window.showToast('Member record updated!', 'success');
            await refreshAllAdminData();
        } catch (err) { window.showToast(err.message, 'error'); }
    };

    // 2. Offer Approval, Completion & Deletion
    window.setOfferStatus = async function(campaignId, newStatus, ownerId, title) {
        try {
            await updateDoc(doc(db, "campaigns", campaignId), {
                status: newStatus,
                updated_at: new Date().toISOString()
            });
            if (ownerId) {
                await addDoc(collection(db, "notifications"), {
                    user_id: ownerId,
                    title: `Offer Status: ${newStatus}`,
                    message: `Your offer "${title}" was updated to ${newStatus} by HAWME Admin.`,
                    detail: `Campaign: ${title}\nNew Status: ${newStatus}\nUpdated at: ${new Date().toLocaleString()}`,
                    campaign_id: campaignId,
                    read: false,
                    created_at: new Date().toISOString()
                });
            }
            window.showToast(`Offer marked as ${newStatus}.`, 'success');
            await refreshAllAdminData();
        } catch (err) { window.showToast(err.message, 'error'); }
    };

    window.promptDeleteOffer = function(campaignId, title) {
        openConfirmModal(
            `Delete Offer "${title}"?`,
            `This offer and all linked applications will be permanently removed from HAWME.`,
            async () => {
                await deleteDoc(doc(db, "campaigns", campaignId));
                for (const a of window.adminState.applications.filter(x => x.campaign_id === campaignId)) {
                    await deleteDoc(doc(db, "applications", a.id));
                }
                window.showToast(`Offer "${title}" deleted.`, 'success');
                await refreshAllAdminData();
            }
        );
    };

    // 3. Admin Application & Video Submission Approval/Completion
    window.adminSetApplicationStatus = async function(appId, newStatus) {
        const appObj = window.adminState.applications.find(a => a.id === appId);
        if (!appObj) return;
        try {
            await updateDoc(doc(db, "applications", appId), { status: newStatus });

            if (newStatus === 'Completed') {
                if (appObj.campaign_id) {
                    await updateDoc(doc(db, "campaigns", appObj.campaign_id), { status: 'Completed' });
                }
                const creatorRef = doc(db, "users", appObj.creator_id);
                const cSnap = await getDoc(creatorRef);
                if (cSnap.exists()) {
                    await updateDoc(creatorRef, {
                        completed_promotions: Number(cSnap.data().completed_promotions || 0) + 1
                    });
                }
            }

            if (appObj.creator_id) {
                await addDoc(collection(db, "notifications"), {
                    user_id: appObj.creator_id,
                    title: `Application ${newStatus}`,
                    message: `Your application for "${appObj.campaign_title}" is now ${newStatus}.`,
                    detail: `Campaign: ${appObj.campaign_title}\nStatus: ${newStatus}\nReviewed by HAWME Admin.`,
                    campaign_id: appObj.campaign_id || '',
                    read: false,
                    created_at: new Date().toISOString()
                });
            }
            window.showToast(`Application set to ${newStatus}.`, 'success');
            await refreshAllAdminData();
        } catch (err) { window.showToast(err.message, 'error'); }
    };

    // 5. Send Custom Notifications to Creators / Companies / Specific User
    window.handleSendAdminNotification = async function(e) {
        e.preventDefault();
        const mode = document.getElementById('notif-target-mode').value;
        const specificUid = document.getElementById('notif-specific-uid')?.value;
        const title = document.getElementById('notif-title').value.trim();
        const message = document.getElementById('notif-message').value.trim();
        const detail = document.getElementById('notif-detail').value.trim();
        const btn = document.getElementById('send-notif-btn');

        let recipients = [];
        if (mode === 'all_creators') {
            recipients = window.adminState.users.filter(u => u.role === 'creator');
        } else if (mode === 'all_companies') {
            recipients = window.adminState.users.filter(u => u.role === 'company');
        } else if (mode === 'all_users') {
            recipients = window.adminState.users;
        } else if (mode === 'single' && specificUid) {
            recipients = window.adminState.users.filter(u => u.id === specificUid);
        }

        if (!recipients.length) {
            window.showToast('No target recipients found.', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerText = `Sending to ${recipients.length}...`;

        try {
            const now = new Date().toISOString();
            for (const u of recipients) {
                await addDoc(collection(db, "notifications"), {
                    user_id: u.id,
                    title,
                    message,
                    detail: detail || message,
                    read: false,
                    created_at: now
                });
            }
            window.showToast(`Notification sent to ${recipients.length} recipient(s)!`, 'success');
            document.getElementById('notif-title').value = '';
            document.getElementById('notif-message').value = '';
            document.getElementById('notif-detail').value = '';
            await refreshAllAdminData();
        } catch (err) {
            window.showToast('Failed to send notifications: ' + err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerText = 'Send Notification';
        }
    };

    // 6. Verification Queue Decisions
    window.handleVerificationDecision = async function(reqId, userId, approve) {
        try {
            await updateDoc(doc(db, "verification_requests", reqId), {
                status: approve ? 'Approved' : 'Rejected',
                reviewed_at: new Date().toISOString()
            });
            if (approve && userId) {
                await updateDoc(doc(db, "users", userId), { is_verified: true });
            }
            if (userId) {
                await addDoc(collection(db, "notifications"), {
                    user_id: userId,
                    title: approve ? 'Verification Approved' : 'Verification Rejected',
                    message: approve
                        ? 'Your HAWME verification badge has been approved!'
                        : 'Your verification request was rejected. Ensure your TikTok bio displays the code and try again.',
                    detail: approve
                        ? 'Your official HAWME verified badge is now visible across your profile and leaderboard.'
                        : 'Verification could not be confirmed. Generate a new code and ensure it remains visible in your TikTok bio for 3 hours.',
                    read: false,
                    created_at: new Date().toISOString()
                });
            }
            window.showToast(approve ? 'Verification approved!' : 'Verification rejected.', 'success');
            await refreshAllAdminData();
        } catch (err) { window.showToast(err.message, 'error'); }
    };

        try {
            await updateDoc(doc(db, "withdrawals", withdrawalId), {

            });

            if (creatorId) {

                    title: 'Withdrawal Completed',

                    detail: `Payout Amount: ETB ${Number(amountEtb).toLocaleString()}\nDestination: ${bankName}\nTransaction Reference: ${txRef}`,

                    created_at: new Date().toISOString()
                });
            }

            window.showToast('Payout marked as Sent & creator notified!', 'success');
            await refreshAllAdminData();
        } catch (err) { window.showToast(err.message, 'error'); }
    };

                                        <span class="font-extrabold text-sm">${window.escapeHTML(a.creator_name)}</span>
                                        <span class="text-xs text-accent font-bold">${window.escapeHTML(a.creator_tiktok)}</span>
                                        <span class="px-2.5 py-0.5 card-inner text-xs font-bold">${window.escapeHTML(a.status)}</span>
                                    </div>
                                    <p class="text-xs text-sec">Campaign: <strong>${window.escapeHTML(a.campaign_title)}</strong></p>
                                    ${a.video_url ? `<p class="text-xs">Submitted Video: <a href="${window.escapeHTML(a.video_url)}" target="_blank" class="text-accent font-bold underline">${window.escapeHTML(a.video_url)}</a></p>` : ''}
                                </div>
                                <div class="flex items-center space-x-2 flex-wrap shrink-0">
                                    ${a.status !== 'Accepted' && a.status !== 'Completed' ? `<button onclick="adminSetApplicationStatus('${a.id}', 'Accepted')" class="px-3 py-1.5 btn-ghost text-xs">Approve App</button>` : ''}
                                    ${a.status !== 'Completed' ? `<button onclick="adminSetApplicationStatus('${a.id}', 'Completed')" class="px-3 py-1.5 btn-cta text-xs">Complete Work</button>` : ''}

                                </div>
                            </div>
                        `).join('') || `<div class="p-8 text-center text-xs text-sec">No applications recorded.</div>`}
                    </div>
                </div>

                <!-- Direct Deals Moderation -->
                <div class="card-outer overflow-hidden">
                    <div class="px-6 py-4 border-b" style="border-color: var(--border-normal);">
                        <h3 class="font-extrabold text-sm">Direct Creator-Company Deals (${s.deals.length})</h3>
                    </div>
                    <div class="divide-y" style="border-color: var(--border-normal);">
                        ${s.deals.map(d => `
                            <div class="p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                                <div class="space-y-1">
                                    <p class="text-xs font-extrabold tabular-nums">${window.escapeHTML(d.company_name)} · ETB ${Number(d.amount_etb || 0).toLocaleString()} · <span class="text-accent">${window.escapeHTML(d.status)}</span></p>
                                    <p class="text-xs text-sec">${window.escapeHTML(d.description)}</p>
                                    ${d.video_url ? `<a href="${window.escapeHTML(d.video_url)}" target="_blank" class="text-xs text-accent underline font-bold">${window.escapeHTML(d.video_url)}</a>` : ''}
                                </div>
                                <div class="flex items-center space-x-2 flex-wrap shrink-0">
                                    <button onclick="adminUpdateDealStatus('${d.id}', 'Escrow_Deposited')" class="px-3 py-1.5 btn-ghost text-xs">Approve Escrow</button>
                                    <button onclick="promptDeleteDeal('${d.id}')" class="px-3 py-1.5 btn-danger text-xs">Delete Deal</button>
                                </div>
                            </div>
                        `).join('') || `<div class="p-8 text-center text-xs text-sec">No direct deals recorded.</div>`}
                    </div>
                </div>
            </div>
        `;
    }

    function renderNotificationsBroadcastTab() {
        const s = window.adminState;
        return `
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <form onsubmit="handleSendAdminNotification(event)" class="card-outer p-6 space-y-4 h-fit">
                    <h3 class="font-extrabold text-base">Send Notification to Creators</h3>
                    <div>
                        <label class="block text-xs font-bold text-sec mb-1.5">Target Recipients</label>
                        <select id="notif-target-mode" onchange="document.getElementById('single-user-picker').classList.toggle('hidden', this.value !== 'single')" class="input-field px-3.5 py-2.5 text-xs font-bold">
                            <option value="all_creators">All Creators (${s.users.filter(u => u.role === 'creator').length})</option>
                            <option value="all_companies">All Companies (${s.users.filter(u => u.role === 'company').length})</option>
                            <option value="all_users">All Platform Users (${s.users.length})</option>
                            <option value="single">Specific Creator / Company</option>
                        </select>
                    </div>

                    <div id="single-user-picker" class="hidden">
                        <label class="block text-xs font-bold text-sec mb-1.5">Select Member</label>
                        <select id="notif-specific-uid" class="input-field px-3.5 py-2.5 text-xs">
                            ${s.users.map(u => `
                                <option value="${u.id}">${window.escapeHTML(u.name || 'User')} (@${window.escapeHTML(u.hawme_username || u.email || '')}) — ${window.escapeHTML(u.role || 'creator')}</option>
                            `).join('')}
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-sec mb-1.5">Notification Title</label>
                        <input type="text" id="notif-title" required class="input-field px-3.5 py-2.5 text-xs" placeholder="New High-Paying Brand Offer">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-sec mb-1.5">Short Summary (Shown in List)</label>
                        <input type="text" id="notif-message" required class="input-field px-3.5 py-2.5 text-xs" placeholder="Apply today to earn up to 15,000 ETB.">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-sec mb-1.5">Full Details (Shown When Clicked)</label>
                        <textarea id="notif-detail" rows="4" required class="input-field p-3.5 text-xs" placeholder="Write complete instructions, payout rules, or announcement details..."></textarea>
                    </div>

                    <button type="submit" id="send-notif-btn" class="w-full py-3.5 btn-cta text-xs">Send Notification</button>
                </form>

                <div class="lg:col-span-2 card-outer overflow-hidden">
                    <div class="px-6 py-4 border-b" style="border-color: var(--border-normal);">
                        <h3 class="font-extrabold text-sm">Recent Sent Notifications (${s.notifications.length})</h3>
                    </div>
                    <div class="divide-y max-h-[620px] overflow-y-auto" style="border-color: var(--border-normal);">
                        ${s.notifications.slice(0, 30).map(n => `
                            <div class="p-4 space-y-1">
                                <div class="flex items-center justify-between gap-2">
                                    <span class="font-extrabold text-xs">${window.escapeHTML(n.title || 'Notification')}</span>
                                    <span class="text-[11px] text-mut tabular-nums">${n.created_at ? new Date(n.created_at).toLocaleString() : ''}</span>
                                </div>
                                <p class="text-xs text-sec">${window.escapeHTML(n.message || '')}</p>
                            </div>
                        `).join('') || `<div class="p-8 text-center text-xs text-sec">No notifications sent yet.</div>`}
                    </div>
                </div>
            </div>
        `;
    }

    function renderVerificationsTab() {
        const s = window.adminState;
        return `
            <div class="card-outer overflow-hidden">
                <div class="px-6 py-4 border-b" style="border-color: var(--border-normal);">
                    <h3 class="font-extrabold text-sm">Verification Requests (${s.verifications.length})</h3>
                </div>
                <div class="divide-y" style="border-color: var(--border-normal);">
                    ${s.verifications.map(v => `
                        <div class="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div class="space-y-1">
                                <div class="flex items-center space-x-2 flex-wrap">
                                    <span class="font-extrabold text-sm">${window.escapeHTML(v.tiktok_username || v.company_name || 'Applicant')}</span>
                                    <span class="px-2.5 py-0.5 card-inner text-xs font-bold uppercase">${window.escapeHTML(v.role || 'creator')}</span>
                                    <span class="px-2.5 py-0.5 card-inner text-xs font-bold text-accent">${window.escapeHTML(v.status)}</span>
                                </div>
                                ${v.verification_code ? `<p class="text-xs text-sec">TikTok Bio Code: <code class="font-mono font-bold text-accent">${window.escapeHTML(v.verification_code)}</code></p>` : ''}
                                ${v.tin_number ? `<p class="text-xs text-sec tabular-nums">TIN: ${window.escapeHTML(v.tin_number)} · <a href="${window.escapeHTML(v.evidence_url || '#')}" target="_blank" class="text-accent underline">View Evidence</a></p>` : ''}
                            </div>
                            <div class="flex items-center space-x-2 shrink-0">
                                ${v.status !== 'Approved' ? `
                                    <button onclick="handleVerificationDecision('${v.id}', '${window.escapeHTML(v.user_id || '')}', true)" class="px-4 py-2 btn-cta text-xs">Approve Badge</button>
                                ` : ''}
                                ${v.status !== 'Rejected' ? `
                                    <button onclick="handleVerificationDecision('${v.id}', '${window.escapeHTML(v.user_id || '')}', false)" class="px-3.5 py-2 btn-danger text-xs">Reject</button>
                                ` : ''}
                            </div>
                        </div>
                    `).join('') || `<div class="p-8 text-center text-xs text-sec">No verification requests submitted yet.</div>`}
                </div>
            </div>
        `;
    }

    function renderPayoutsTab() {
        const s = window.adminState;
        return `
            <div class="space-y-6">
                <div class="card-outer overflow-hidden">
                    <div class="px-6 py-4 border-b" style="border-color: var(--border-normal);">
                        <h3 class="font-extrabold text-sm">Creator Withdrawal Requests (${s.withdrawals.length})</h3>
                    </div>
                    <div class="divide-y" style="border-color: var(--border-normal);">
                        ${s.withdrawals.map(w => `
                            <div class="p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                                <div class="space-y-1">
                                    <div class="flex items-center space-x-2 flex-wrap">
                                        <span class="font-extrabold text-sm">${window.escapeHTML(w.creator_name || 'Creator')} (${window.escapeHTML(w.creator_tiktok || '')})</span>
                                        <span class="text-sm font-black text-emerald-400 tabular-nums">ETB ${Number(w.amount_etb || 0).toLocaleString()}</span>
                                        <span class="px-2.5 py-0.5 card-inner text-xs font-bold">${window.escapeHTML(w.status)}</span>
                                    </div>
                                    <p class="text-xs text-sec tabular-nums">
                                        Bank: <strong>${window.escapeHTML(w.bank_name)}</strong> · Holder: <strong>${window.escapeHTML(w.account_holder)}</strong> · Account: <strong class="text-accent">${window.escapeHTML(w.account_number)}</strong>
                                    </p>
                                    ${w.transaction_reference ? `<p class="text-xs text-emerald-400 font-bold">Ref: ${window.escapeHTML(w.transaction_reference)}</p>` : ''}
                                </div>
                                ${w.status !== 'Completed' ? `
                                    <div class="flex items-center space-x-2 shrink-0">
                                        <input type="text" id="tx-ref-${w.id}" placeholder="Telebirr / Bank Ref #" class="input-field px-3 py-2 text-xs w-44">
                                        <button onclick="completeCreatorWithdrawal('${w.id}', '${window.escapeHTML(w.creator_id || '')}', ${Number(w.amount_etb || 0)}, '${window.escapeHTML(w.bank_name || '')}')" class="px-4 py-2 btn-cta text-xs">Mark Paid</button>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('') || `<div class="p-8 text-center text-xs text-sec">No withdrawal requests submitted yet.</div>`}
                    </div>
                </div>

                <div class="card-outer overflow-hidden">
                    <div class="px-6 py-4 border-b" style="border-color: var(--border-normal);">
                        <h3 class="font-extrabold text-sm">Company Escrow Deposits (${s.transactions.length})</h3>
                    </div>
                    <div class="divide-y" style="border-color: var(--border-normal);">
                        ${s.transactions.map(t => `
                            <div class="p-5 flex items-center justify-between gap-4 tabular-nums">
                                <div>
                                    <p class="text-xs font-extrabold">ETB ${Number(t.amount_etb || 0).toLocaleString()} · <span class="text-accent">${window.escapeHTML(t.escrow_telebirr || '0996350347')}</span></p>
                                    <p class="text-xs text-sec mt-0.5">Deal ID: ${window.escapeHTML(t.deal_id || '')} · Status: ${window.escapeHTML(t.status || '')}</p>
                                </div>
                                <span class="text-xs text-mut">${t.created_at ? new Date(t.created_at).toLocaleDateString() : ''}</span>
                            </div>
                        `).join('') || `<div class="p-8 text-center text-xs text-sec">No escrow deposits recorded yet.</div>`}
                    </div>
                </div>
            </div>
        `;
    }

    function renderCommunityTab() {
        const s = window.adminState;
        return `
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <form onsubmit="handlePublishCommunityPost(event)" class="card-outer p-6 space-y-4 h-fit">
                    <h3 class="font-extrabold text-base">Publish HAWME Announcement</h3>
                    <div>
                        <label class="block text-xs font-bold text-sec mb-1.5">Post Caption</label>
                        <textarea id="admin-post-caption" rows="4" required class="input-field p-3.5 text-xs" placeholder="Share platform updates, creator tips, or featured campaigns..."></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-sec mb-1.5">Image (Optional)</label>
                        <input type="file" id="admin-post-image" accept="image/*" class="w-full text-xs text-sec file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border file:border-current file:text-xs file:font-bold file:bg-transparent">
                    </div>
                    <button type="submit" id="publish-post-btn" class="w-full py-3 btn-cta text-xs">Publish Announcement</button>
                </form>

                <div class="lg:col-span-2 space-y-4">
                    ${s.posts.map(p => `
                        <div class="card-outer p-5 flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                            <div class="space-y-2 min-w-0">
                                <p class="text-xs text-mut tabular-nums">${p.created_at ? new Date(p.created_at).toLocaleString() : ''} · ${Number(p.likes_count || 0)} Likes</p>
                                <p class="text-xs leading-relaxed whitespace-pre-line">${window.escapeHTML(p.caption || '')}</p>
                                ${p.image_url ? `<img src="${window.escapeHTML(p.image_url)}" class="max-h-48 rounded-xl object-cover">` : ''}
                            </div>
                            <button onclick="promptDeletePost('${p.id}')" class="px-3.5 py-2 btn-danger text-xs shrink-0">Delete</button>
                        </div>
                    `).join('') || `<div class="card-outer p-8 text-center text-xs text-sec">No community posts published yet.</div>`}
                </div>
            </div>
        `;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const savedTheme = localStorage.getItem('hawme_theme_mode') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            const icon = document.getElementById('theme-toggle-icon');
            if (icon) icon.setAttribute('data-lucide', 'moon');
        }
        updateHeaderSessionUI();
        if (window.adminState.unlocked) {
            await refreshAllAdminData();
        } else {
            renderAdminApp();
        }
    });
</script>
</body>
</html>
